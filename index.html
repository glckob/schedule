        // ================= Class Components =================
        function ClassManager({ classes, addClass, updateClass, removeClass, allSubjects, handleImportData }) {
            const [editingId, setEditingId] = useState(null);
            const [grade, setGrade] = useState('១២');
            const [section, setSection] = useState('A');
            const [studentsCount, setStudentsCount] = useState(40);
            
            const [subjectHours, setSubjectHours] = useState(() => {
                const initial = {};
                allSubjects.forEach(s => initial[s] = 0);
                return initial;
            });

            useEffect(() => {
                setSubjectHours(prev => {
                    const next = { ...prev };
                    allSubjects.forEach(s => { if (next[s] === undefined) next[s] = 0; });
                    return next;
                });
            }, [allSubjects]);

            const handleSubmit = (e) => {
                e.preventDefault();
                const name = `${grade}${section}`;
                const level = parseInt(grade) <= 9 ? 'បឋមភូមិ' : 'ទុតិយភូមិ';
                
                const cleanSubjectHours = {};
                Object.entries(subjectHours).forEach(([sub, h]) => {
                    cleanSubjectHours[sub] = parseInt(h) || 0;
                });

                if (editingId) {
                    updateClass(editingId, { name, grade, section, level, studentsCount, subjectHours: cleanSubjectHours });
                    setEditingId(null);
                } else {
                    addClass({ name, grade, section, level, studentsCount, subjectHours: cleanSubjectHours });
                }
                
                setStudentsCount(40);
                const initial = {};
                allSubjects.forEach(s => initial[s] = 0);
                setSubjectHours(initial);
            };

            const handleEdit = (cls) => {
                setGrade(cls.grade || (cls.name ? cls.name.match(/([០-៩]+|\d+)/)?.[0] : '១២') || '១២');
                setSection(cls.section || (cls.name ? cls.name.match(/[A-Za-z]+/)?.[0] : 'A') || 'A');
                setStudentsCount(cls.studentsCount || 40);
                
                const initialHours = {};
                allSubjects.forEach(s => initialHours[s] = cls.subjectHours?.[s] || 0);
                setSubjectHours(initialHours);
                setEditingId(cls.id);
            };

            const cancelEdit = () => {
                setEditingId(null);
                setStudentsCount(40);
                const initial = {};
                allSubjects.forEach(s => initial[s] = 0);
                setSubjectHours(initial);
            };

            const handleHoursChange = (sub, val) => {
                setSubjectHours({ ...subjectHours, [sub]: val === '' ? '' : parseInt(val) || 0 });
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = window.XLSX.read(data, {type: 'array'});
                        
                        let newSubjects = new Set(allSubjects);
                        let classList = [];
                        let curriculumMap = {};

                        workbook.SheetNames.forEach(sheetName => {
                            const rawData = window.XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "" });
                            if (rawData.length < 2) return;

                            const gradeHeaderRowIdx = rawData.findIndex(row => row.some(cell => String(cell).includes('អក្សរថ្នាក់')));
                            if (gradeHeaderRowIdx !== -1) {
                                const headers = rawData[gradeHeaderRowIdx];
                                const gradeIdx = headers.findIndex(h => String(h).includes('ថ្នាក់') && !String(h).includes('អក្សរ') && !String(h).includes('ប្រភេទ'));
                                const sectionIdx = headers.findIndex(h => String(h).includes('អក្សរថ្នាក់'));
                                const typeIdx = headers.findIndex(h => String(h).includes('ប្រភេទថ្នាក់'));
                                const levelIdx = headers.findIndex(h => String(h).includes('កម្រិត'));
                                
                                for (let i = gradeHeaderRowIdx + 1; i < rawData.length; i++) {
                                    const row = rawData[i];
                                    if (!row[gradeIdx] && !row[sectionIdx]) continue;
                                    
                                    let gradeStr = String(row[gradeIdx] || '').trim();
                                    let sectionStr = String(row[sectionIdx] || '').trim();
                                    let typeStr = String(typeIdx !== -1 ? row[typeIdx] : '').trim();
                                    let levelStr = String(levelIdx !== -1 ? row[levelIdx] : '').trim();

                                    let parsedGrade = gradeStr.replace(/[០-៩]/g, m => '០១២៣៤៥៦៧៨៩'.indexOf(m));

                                    if (gradeStr || sectionStr) {
                                        classList.push({
                                            grade: parsedGrade,
                                            section: sectionStr,
                                            type: typeStr,
                                            level: levelStr,
                                            name: `${parsedGrade}${sectionStr}`
                                        });
                                    }
                                }
                            }

                            const subjHeaderRowIdx = rawData.findIndex(row => row.some(cell => String(cell).includes('មុខវិជ្ជា')));
                            if (subjHeaderRowIdx !== -1) {
                                const colMap = {};
                                const subHeaderRow = rawData[subjHeaderRowIdx];

                                for (let col = 0; col < subHeaderRow.length; col++) {
                                    let subHeader = String(subHeaderRow[col] || '').trim();
                                    let key = '';
                                    
                                    if (subHeader.includes('៧') || subHeader.includes('7')) key = '7';
                                    else if (subHeader.includes('៨') || subHeader.includes('8')) key = '8';
                                    else if (subHeader.includes('៩') || subHeader.includes('9')) key = '9';
                                    else if (subHeader.includes('១០') || subHeader.includes('10')) {
                                        key = subHeader.includes('សង្គម') ? '10_សង្គម' : '10_វិទ្យាសាស្ត្រ';
                                    }
                                    else if (subHeader.includes('១១') || subHeader.includes('11')) {
                                        key = subHeader.includes('សង្គម') ? '11_សង្គម' : '11_វិទ្យាសាស្ត្រ';
                                    }
                                    else if (subHeader.includes('១២') || subHeader.includes('12')) {
                                        key = subHeader.includes('សង្គម') ? '12_សង្គម' : '12_វិទ្យាសាស្ត្រ';
                                    }
                                    
                                    if (key) colMap[col] = key;
                                }

                                const subjColIdx = subHeaderRow.findIndex(cell => String(cell).includes('មុខវិជ្ជា'));
                                
                                for (let i = subjHeaderRowIdx + 1; i < rawData.length; i++) {
                                    const row = rawData[i];
                                    let subject = String(row[subjColIdx] || '').trim();
                                    if (!subject || subject.includes('សរុប') || subject.match(/total/i)) continue;
                                    
                                    subject = subject.replace(/[\n\r]+/g, ' ').replace(/\s{2,}/g, ' ');
                                    newSubjects.add(subject);

                                    Object.keys(colMap).forEach(colIdx => {
                                        let hours = parseInt(row[colIdx]) || 0;
                                        let mapKey = colMap[colIdx];
                                        if (!curriculumMap[mapKey]) curriculumMap[mapKey] = {};
                                        if (hours > 0) {
                                            curriculumMap[mapKey][subject] = hours;
                                        }
                                    });
                                }
                            }
                        });

                        const finalClasses = [];
                        classList.forEach(c => {
                            let typeKey = '';
                            if (parseInt(c.grade) >= 10) {
                                typeKey = (c.type && c.type.includes('សង្គម')) ? 'សង្គម' : 'វិទ្យាសាស្ត្រ';
                            }
                            
                            let lookupKey = typeKey ? `${c.grade}_${typeKey}` : c.grade;
                            let subjectHours = curriculumMap[lookupKey] || {};
                            
                            let finalLevel = c.level;
                            if (!finalLevel) {
                                finalLevel = parseInt(c.grade) <= 9 ? 'បឋមភូមិ' : 'ទុតិយភូមិ';
                            }
                            if (c.type && !finalLevel.includes(c.type)) {
                                finalLevel = `${finalLevel} (${c.type})`;
                            }

                            finalClasses.push({
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                                name: c.name,
                                grade: c.grade,
                                section: c.section,
                                level: finalLevel,
                                studentsCount: 40,
                                subjectHours: { ...subjectHours }
                            });
                        });

                        if (finalClasses.length === 0) {
                            alert("រកមិនឃើញទិន្នន័យថ្នាក់ (Sheet ដែលមានជួរឈរ 'អក្សរថ្នាក់') ទេ!");
                            return;
                        }

                        if (confirm(`រកឃើញថ្នាក់ចំនួន ${finalClasses.length} និងមុខវិជ្ជាសរុប ${newSubjects.size}។ តើអ្នកចង់នាំចូលមែនទេ?`)) {
                            handleImportData(finalClasses, Array.from(newSubjects));
                        }
                    } catch (error) {
                        console.error(error);
                        alert('មានបញ្ហាក្នុងការអានឯកសារ Excel។');
                    }
                    e.target.value = null;
                };
                reader.readAsArrayBuffer(file);
            };

            const totalHours = Object.values(subjectHours).reduce((a, b) => a + (parseInt(b) || 0), 0);

            return (
                <div className="flex flex-col lg:flex-row gap-6 h-full print:block print:h-auto print:overflow-visible">
                    <style>{`
                        @media print {
                            body, html, #root, .h-screen, .overflow-hidden, .overflow-auto, main { height: auto !important; overflow: visible !important; display: block !important; }
                            .print-hide-border { border: none !important; box-shadow: none !important; padding: 0 !important; background: transparent !important; }
                        }
                    `}</style>
                    {/* Form Section */}
                    <div className="w-full lg:w-[70%] bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col shrink-0 overflow-y-auto custom-scrollbar print:hidden" style={{maxHeight: 'calc(100vh - 120px)'}}>
                        <h2 className="text-lg font-bold mb-4 text-blue-800 flex items-center gap-2 border-b pb-2 sticky top-0 bg-white z-10">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            {editingId ? 'កែប្រែទិន្នន័យថ្នាក់រៀន' : 'បន្ថែមថ្នាក់រៀនថ្មី'}
                        </h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">ថ្នាក់ទី</label>
                                    <select value={grade} onChange={e => setGrade(e.target.value)} className="w-full border p-2 rounded focus:ring-blue-500 font-bold bg-gray-50">
                                        {['៧','៨','៩','១០','១១','១២'].map(g => <option key={g} value={g}>{g}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">កម្រិត (Section)</label>
                                    <select value={section} onChange={e => setSection(e.target.value)} className="w-full border p-2 rounded focus:ring-blue-500 font-bold bg-gray-50">
                                        {['A','B','C','D','E','F','G'].map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">ចំនួនសិស្ស</label>
                                <input type="number" value={studentsCount} onChange={e => setStudentsCount(parseInt(e.target.value)||0)} className="w-full border p-2 rounded focus:ring-blue-500" required />
                            </div>
                            
                            <div className="pt-2">
                                <div className="flex justify-between items-center mb-2 sticky top-0 bg-white z-10 py-1">
                                    <label className="block text-sm font-bold text-gray-700">ចំនួនម៉ោងក្នុង១សប្តាហ៍</label>
                                    <span className="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-1 rounded-md shadow-sm border border-blue-200">សរុប៖ {totalHours} ម៉ោង</span>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 border rounded-lg p-2 bg-gray-50 max-h-60 overflow-y-auto custom-scrollbar">
                                    {allSubjects.map(sub => {
                                        const hours = subjectHours[sub] !== undefined ? subjectHours[sub] : 0;
                                        const isZero = hours === 0 || hours === '';
                                        return (
                                        <div key={sub} className={`flex items-center justify-between p-1 rounded border shadow-sm transition-colors ${isZero ? 'bg-red-50 border-red-200 hover:bg-red-100' : 'bg-white hover:bg-blue-50'}`}>
                                            <span className={`text-xs font-bold ml-1 truncate ${isZero ? 'text-red-700' : 'text-gray-700'}`} title={sub}>{sub}</span>
                                            <input type="number" 
                                                value={hours} 
                                                onChange={e => handleHoursChange(sub, e.target.value)} 
                                                className={`w-12 border p-0.5 rounded text-center text-xs font-bold focus:ring-2 shrink-0 ml-1 ${isZero ? 'bg-red-100 border-red-300 text-red-700 focus:ring-red-400' : 'bg-gray-50 focus:ring-blue-400'}`} min="0" />
                                        </div>
                                    )})}
                                </div>
                            </div>
                            <div className="pt-4 sticky bottom-0 bg-white mt-4 border-t flex gap-3">
                                {editingId && (
                                    <button type="button" onClick={cancelEdit} className="w-1/3 bg-gray-200 text-gray-700 font-bold py-3 rounded-lg shadow-sm hover:bg-gray-300 transition-colors">
                                        បោះបង់
                                    </button>
                                )}
                                <button type="submit" className={`${editingId ? 'w-2/3 bg-green-600 hover:bg-green-700' : 'w-full bg-blue-600 hover:bg-blue-700'} text-white font-bold py-3 rounded-lg shadow-md transition-colors`}>
                                    {editingId ? 'រក្សាទុកការកែប្រែ' : 'រក្សាទុកថ្នាក់រៀន'}
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* List Section */}
                    <div className="w-full lg:w-[30%] bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col overflow-hidden print-hide-border print:w-full print:max-h-none print:overflow-visible" style={{maxHeight: 'calc(100vh - 120px)'}}>
                        <div className="flex flex-wrap justify-between items-center mb-4 border-b pb-2 shrink-0 gap-2 print:hidden">
                            <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg>
                                បញ្ជីថ្នាក់ ({classes.length})
                            </h2>
                            <div className="flex gap-2">
                                <button type="button" onClick={() => window.print()} className="bg-gray-800 text-white hover:bg-gray-900 px-3 py-1.5 rounded text-xs font-bold transition-colors flex items-center gap-1 shadow-sm" title="បោះពុម្ពបញ្ជីថ្នាក់រៀន">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M6.728 3.478a.75.75 0 00-.728.75v3.75m12-4.5a.75.75 0 00-.728-.75h-10.5M21 10.5a.75.75 0 00-.75-.75h-16.5a.75.75 0 00-.75.75v6a.75.75 0 00.75.75h3v3a.75.75 0 00.75.75h10.5a.75.75 0 00.75-.75v-3h3a.75.75 0 00.75-.75v-6zM15 16.5H9v-3h6v3z" /></svg>
                                    បោះពុម្ព
                                </button>
                                <input type="file" id="excel-upload" className="hidden" accept=".xlsx, .xls" onChange={handleFileUpload} />
                                <button type="button" onClick={() => document.getElementById('excel-upload').click()} className="bg-green-100 text-green-700 hover:bg-green-200 px-3 py-1.5 rounded text-xs font-bold border border-green-200 transition-colors flex items-center gap-1 shadow-sm" title="នាំចូលពី Excel">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
                                    នាំចូល Excel
                                </button>
                            </div>
                        </div>
                        <div className="overflow-y-auto custom-scrollbar flex-1 pr-2 print:overflow-visible">
                            <div className="grid grid-cols-1 gap-4 pb-4 print:hidden">
                                {classes.length === 0 && <div className="col-span-full p-10 text-center text-gray-500 bg-gray-50 rounded-xl border-2 border-dashed">មិនទាន់មានទិន្នន័យថ្នាក់រៀន</div>}
                                {classes.map(c => (
                                    <div key={c.id} className={`bg-white border rounded-xl p-4 shadow-sm relative group hover:border-blue-300 transition-colors ${editingId === c.id ? 'border-blue-500 ring-2 ring-blue-200' : ''}`}>
                                        <div className="absolute top-3 right-3 flex gap-1 opacity-0 group-hover:opacity-100 transition-all">
                                            <button onClick={() => handleEdit(c)} className="text-gray-400 hover:text-blue-500 hover:bg-blue-50 p-1 rounded-full transition-all" title="កែប្រែ">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" /></svg>
                                            </button>
                                            <button onClick={() => removeClass(c.id)} className="text-gray-400 hover:text-red-500 hover:bg-red-50 p-1 rounded-full transition-all" title="លុប">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                                            </button>
                                        </div>
                                        <div className="flex items-center gap-2 mb-2 pr-10">
                                            <h3 className="font-bold text-gray-800 text-lg leading-tight">ថ្នាក់ {c.name}</h3>
                                            <span className="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded text-[10px] font-bold border border-indigo-100">{c.level}</span>
                                            <span className="bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded text-[10px] font-bold border border-blue-100">សិស្ស៖ {c.studentsCount}</span>
                                        </div>
                                        <div className="border-t pt-2 mt-2 bg-gray-50 -mx-4 -mb-4 p-3 rounded-b-xl">
                                            <div className="text-xs font-bold text-gray-500 mb-1.5 flex justify-between">
                                                <span>ម៉ោងសិក្សា</span>
                                                <span className="text-blue-700">សរុប៖ {Object.values(c.subjectHours || {}).reduce((a,b)=>a+b,0)}</span>
                                            </div>
                                            <div className="flex flex-wrap gap-1">
                                                {Object.entries(c.subjectHours || {}).filter(([_, h]) => h > 0).map(([sub, h]) => (
                                                    <span key={sub} className="bg-white border text-[11px] px-1.5 py-0.5 rounded text-gray-700">{sub}: <b className="text-blue-600">{h}</b></span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Printable Summary Table (Hidden on screen, shown in print) */}
                            <div className="hidden print:block w-full">
                                <div className="text-center mb-6">
                                    <h1 className="text-2xl font-bold mb-2 font-khmer-muol">តារាងសង្ខេបកម្រិតថ្នាក់ និងចំនួនម៉ោងបង្រៀន</h1>
                                    <h2 className="text-lg font-bold text-gray-700">សរុបមានចំនួន {classes.length} ថ្នាក់</h2>
                                </div>
                                <table className="w-full text-sm text-center border-collapse border border-gray-800 print-border-black">
                                    <thead>
                                        <tr className="bg-gray-200">
                                            <th className="border border-gray-800 p-2 w-12">ល.រ</th>
                                            <th className="border border-gray-800 p-2 w-20">ថ្នាក់</th>
                                            <th className="border border-gray-800 p-2 w-32">កម្រិត</th>
                                            <th className="border border-gray-800 p-2 w-20">សិស្ស</th>
                                            <th className="border border-gray-800 p-2 w-24">ម៉ោងសរុប</th>
                                            <th className="border border-gray-800 p-2 text-left">មុខវិជ្ជា និងចំនួនម៉ោង</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {classes.map((c, i) => (
                                            <tr key={c.id}>
                                                <td className="border border-gray-800 p-2">{i + 1}</td>
                                                <td className="border border-gray-800 p-2 font-bold">{c.name}</td>
                                                <td className="border border-gray-800 p-2">{c.level}</td>
                                                <td className="border border-gray-800 p-2">{c.studentsCount}</td>
                                                <td className="border border-gray-800 p-2 font-bold">{Object.values(c.subjectHours || {}).reduce((a,b)=>a+b,0)}</td>
                                                <td className="border border-gray-800 p-2 text-left text-xs leading-relaxed">
                                                    {Object.entries(c.subjectHours || {}).filter(([_, h]) => h > 0).map(([sub, h]) => `${sub}(${h})`).join(', ')}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
