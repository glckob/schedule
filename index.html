<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កាលវិភាគវិទ្យាល័យកូប</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- បន្ថែម Firebase Modules នៅទីនេះ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // បញ្ជូនវាទៅ window ដើម្បីអាចប្រើក្នុង React (Babel) បាន
        window.FirebaseAPI = { initializeApp, getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, EmailAuthProvider, reauthenticateWithCredential, getFirestore, doc, setDoc, getDoc };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', 'Siemreap', sans-serif; background-color: #f3f4f6; }
        .font-khmer-muol { font-family: 'Moul', cursive; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            .no-print { display: none !important; }
            body, .bg-gray-100, .bg-white { background: white !important; }
            .print-overflow-visible { overflow: visible !important; }
            .print-border-black th, .print-border-black td { border-color: #000 !important; }
            table { font-size: 11pt; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const WEEK_DAYS = ['ច័ន្ទ', 'អង្គារ', 'ពុធ', 'ព្រហស្បតិ៍', 'សុក្រ', 'សៅរ៍'];
        const DAYS = ['ច័ន្ទ - ព្រឹក', 'ច័ន្ទ - ល្ងាច', 'អង្គារ - ព្រឹក', 'អង្គារ - ល្ងាច', 'ពុធ - ព្រឹក', 'ពុធ - ល្ងាច', 'ព្រហស្បតិ៍ - ព្រឹក', 'ព្រហស្បតិ៍ - ល្ងាច', 'សុក្រ - ព្រឹក', 'សុក្រ - ល្ងាច', 'សៅរ៍ - ព្រឹក'];
        
        // Added 'time' property to match the template
        const SLOTS = [
            { id: 'm1', name: 'ម៉ោង ៧:០០ - ៨:០០', type: 'Morning', time: '០៧-០៨' },
            { id: 'm2', name: 'ម៉ោង ៨:០០ - ៩:០០', type: 'Morning', time: '០៨-០៩' },
            { id: 'm3', name: 'ម៉ោង ៩:០០ - ១០:០០', type: 'Morning', time: '០៩-១០' },
            { id: 'm4', name: 'ម៉ោង ១០:០០ - ១១:០០', type: 'Morning', time: '១០-១១' },
            { id: 'a1', name: 'ម៉ោង ១៣:០០ - ១៤:០០', type: 'Afternoon', time: '១៣-១៤' },
            { id: 'a2', name: 'ម៉ោង ១៤:០០ - ១៥:០០', type: 'Afternoon', time: '១៤-១៥' },
            { id: 'a3', name: 'ម៉ោង ១៥:០០ - ១៦:០០', type: 'Afternoon', time: '១៥-១៦' }
        ];

        const MORNING_SLOTS = SLOTS.filter(s => s.type === 'Morning');
        const AFTERNOON_SLOTS = SLOTS.filter(s => s.type === 'Afternoon');

        const DEFAULT_SUBJECTS = ['គណិតវិទ្យា', 'រូបវិទ្យា', 'គីមីវិទ្យា', 'ជីវវិទ្យា', 'ផែនដីវិទ្យា', 'ភាសាខ្មែរ', 'សីលធម៌', 'ប្រវត្តិវិទ្យា', 'ភូមិវិទ្យា', 'ភាសាអង់គ្លេស', 'កុំព្យូទ័រ', 'កីឡា', 'កសិកម្ម', 'សេដ្ឋកិច្ច', 'ភាសាបារាំង', 'សិល្បៈ', 'អប់រំសុខភាព'];

        // ការកំណត់គម្រោង Firebase របស់អ្នក
        const firebaseConfig = {
            apiKey: "AIzaSyD5i1ppcMcyheAeepyuXEfrnIZWNZVz82s",
            authDomain: "schedule-bc5d1.firebaseapp.com",
            projectId: "schedule-bc5d1",
            storageBucket: "schedule-bc5d1.firebasestorage.app",
            messagingSenderId: "940407397764",
            appId: "1:940407397764:web:08751ec6b4031ec75991d1",
            measurementId: "G-VTG50H7JNP"
        };

        let app, db, auth;

        function App() {
            const [activeTab, setActiveTab] = useState('subjects');
            const [teachers, setTeachers] = useState([]);
            const [classes, setClasses] = useState([]);
            const [schedules, setSchedules] = useState({});
            const [allSubjects, setAllSubjects] = useState(DEFAULT_SUBJECTS);
            const [isLoaded, setIsLoaded] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [user, setUser] = useState(null);
            
            // State សម្រាប់ School Profile
            const [schoolProfile, setSchoolProfile] = useState({
                name: 'ឈ្មោះសាលារៀន',
                department: 'មន្ទីរអប់រំ យុវជន និងកីឡាខេត្ត...',
                academicYear: '២០២៤ - ២០២៥'
            });
            
            // State សម្រាប់ Login
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);

            // ទាញយកទិន្នន័យពី Firebase Firestore នៅពេលបើកកម្មវិធី
            useEffect(() => {
                let unsubscribeAuth = null;
                let isMounted = true;
                
                const initFirebase = () => {
                    if (window.FirebaseAPI && window.FirebaseAPI.onAuthStateChanged) {
                        try {
                            if (!app) {
                                app = window.FirebaseAPI.initializeApp(firebaseConfig);
                            }
                            if (!auth) auth = window.FirebaseAPI.getAuth(app);
                            if (!db) db = window.FirebaseAPI.getFirestore(app);

                            // ស្តាប់ការផ្លាស់ប្តូរអ្នកប្រើប្រាស់
                            unsubscribeAuth = window.FirebaseAPI.onAuthStateChanged(auth, async (currentUser) => {
                                if (!isMounted) return;

                                if (currentUser) {
                                    // កំណត់ទីតាំងផ្ទុកទិន្នន័យ (ឯកជនសម្រាប់អ្នកប្រើម្នាក់ៗ)
                                    const appId = "kob_schedule_app"; 
                                    const docRef = window.FirebaseAPI.doc(db, 'artifacts', appId, 'users', currentUser.uid, 'schoolData', 'main');
                                    
                                    try {
                                        // អានទិន្នន័យតែម្តងពេលបើកកម្មវិធី
                                        const docSnap = await window.FirebaseAPI.getDoc(docRef);
                                        if (docSnap.exists()) {
                                            const data = docSnap.data();
                                            if (data.teachers) setTeachers(data.teachers);
                                            if (data.classes) setClasses(data.classes);
                                            if (data.schedules) setSchedules(data.schedules);
                                            
                                            // ជួសជុលបញ្ហាលោតមុខវិជ្ជាមកវិញ
                                            if (data.allSubjects !== undefined && Array.isArray(data.allSubjects)) {
                                                setAllSubjects(data.allSubjects); 
                                            } else {
                                                setAllSubjects(DEFAULT_SUBJECTS);
                                            }
                                            if (data.isSidebarOpen !== undefined) setIsSidebarOpen(data.isSidebarOpen);
                                            if (data.schoolProfile) setSchoolProfile(data.schoolProfile);
                                        } else {
                                             // ប្រសិនបើមិនទាន់មាន Document ទេ នោះទើបបង្កើតថ្មី
                                             await window.FirebaseAPI.setDoc(docRef, {
                                                teachers: [],
                                                classes: [],
                                                schedules: {},
                                                allSubjects: DEFAULT_SUBJECTS,
                                                isSidebarOpen: true,
                                                schoolProfile: { name: 'ឈ្មោះសាលារៀន', department: 'មន្ទីរអប់រំ យុវជន និងកីឡាខេត្ត...', academicYear: '២០២៤ - ២០២៥' },
                                                updatedAt: new Date().toISOString()
                                            });
                                        }
                                    } catch (error) {
                                        console.error("Firestore getDoc Error:", error);
                                    }
                                    
                                    setUser(currentUser);
                                    // ប្រើ setTimeout ដើម្បីប្រាកដថា State ទាំងអស់ Update ចូលប្រព័ន្ធសិនមុននឹងបើកសិទ្ធិឲ្យ Save
                                    setTimeout(() => {
                                        if (isMounted) setIsLoaded(true);
                                    }, 100);
                                } else {
                                    // បើគ្មាន Session ទេ បង្ហាញផ្ទាំង Login
                                    setUser(null);
                                    setIsLoaded(true);
                                }
                            });
                        } catch (err) {
                            console.error("Firebase Config Error:", err);
                        }
                    } else {
                        setTimeout(initFirebase, 100); 
                    }
                };

                initFirebase();

                return () => {
                    isMounted = false;
                    if (unsubscribeAuth) unsubscribeAuth();
                };
            }, []);

            // មុខងារ Login
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                setIsLoggingIn(true);
                try {
                    await window.FirebaseAPI.signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    console.error("Login Error:", error);
                    setLoginError('អ៊ីមែល ឬ លេខសម្ងាត់មិនត្រឹមត្រូវទេ។ សូមព្យាយាមម្តងទៀត។');
                } finally {
                    setIsLoggingIn(false);
                }
            };

            // មុខងារ Logout
            const handleLogout = () => {
                if (window.confirm('តើអ្នកពិតជាចង់ចាកចេញមែនទេ?')) {
                    window.FirebaseAPI.signOut(auth).catch(error => console.error("Logout Error:", error));
                }
            };

            // រក្សាទុកទិន្នន័យទៅ Firebase វិញរាល់ពេលមានការផ្លាស់ប្តូរ
            useEffect(() => {
                if (!isLoaded || !user || !window.FirebaseAPI) return;

                // ប្រើ Debounce (ពន្យារពេល 0.5s) ដើម្បីការពារកុំឲ្យវា Save ខុសពេលដែលទិន្នន័យកំពុង Load
                const saveTimer = setTimeout(() => {
                    const appId = "kob_schedule_app";
                    const docRef = window.FirebaseAPI.doc(db, 'artifacts', appId, 'users', user.uid, 'schoolData', 'main');
                    
                    window.FirebaseAPI.setDoc(docRef, {
                        teachers,
                        classes,
                        schedules,
                        allSubjects,
                        isSidebarOpen,
                        schoolProfile,
                        updatedAt: new Date().toISOString()
                    }).catch(err => console.error("Error saving data:", err));
                }, 500);

                return () => clearTimeout(saveTimer);
            }, [teachers, classes, schedules, allSubjects, isSidebarOpen, schoolProfile, isLoaded, user]);

            const addTeacher = (teacher) => {
                setTeachers([...teachers, { ...teacher, id: Date.now().toString() }]);
            };

            const removeTeacher = (id) => {
                if (confirm('តើអ្នកពិតជាចង់លុបគ្រូនេះមែនទេ?')) {
                    setTeachers(teachers.filter(t => t.id !== id));
                }
            };

            const addClass = (cls) => {
                setClasses([...classes, { ...cls, id: Date.now().toString() }]);
            };

            const removeClass = (id) => {
                if (confirm('តើអ្នកពិតជាចង់លុបថ្នាក់នេះមែនទេ?')) {
                    setClasses(classes.filter(c => c.id !== id));
                    const newSchedules = { ...schedules };
                    delete newSchedules[id];
                    setSchedules(newSchedules);
                }
            };

            const updateTeacher = (id, updatedTeacher) => {
                setTeachers(teachers.map(t => t.id === id ? { ...updatedTeacher, id } : t));
            };

            const updateClass = (id, updatedClass) => {
                setClasses(classes.map(c => c.id === id ? { ...updatedClass, id } : c));
            };

            const updateSubject = (oldName, newName) => {
                if (allSubjects.includes(newName)) {
                    alert('ឈ្មោះមុខវិជ្ជានេះមានរួចហើយ!');
                    return;
                }
                setAllSubjects(allSubjects.map(s => s === oldName ? newName : s));
                
                setTeachers(teachers.map(t => ({
                    ...t,
                    subjects: t.subjects ? t.subjects.map(s => s === oldName ? newName : s) : []
                })));
                
                setClasses(classes.map(c => {
                    const newHours = { ...c.subjectHours };
                    if (newHours[oldName] !== undefined) {
                        newHours[newName] = newHours[oldName];
                        delete newHours[oldName];
                    }
                    return { ...c, subjectHours: newHours };
                }));
            };

            const removeSubject = (subjectName) => {
                if (confirm(`តើអ្នកពិតជាចង់លុបមុខវិជ្ជា "${subjectName}" មែនទេ? (វានឹងលុបពីទិន្នន័យគ្រូ និងថ្នាក់រៀនផងដែរ)`)) {
                    setAllSubjects(allSubjects.filter(s => s !== subjectName));
                    setTeachers(teachers.map(t => ({
                        ...t,
                        subjects: t.subjects ? t.subjects.filter(s => s !== subjectName) : []
                    })));
                    setClasses(classes.map(c => {
                        const newHours = { ...c.subjectHours };
                        delete newHours[subjectName];
                        return { ...c, subjectHours: newHours };
                    }));
                }
            };

            const handleDeleteAllData = async () => {
                if (!user) return;
                
                // សុំលេខសម្ងាត់មុននឹងលុប
                const passwordInput = window.prompt(`ដើម្បីបញ្ជាក់សុវត្ថិភាព សូមបញ្ចូលលេខសម្ងាត់សម្រាប់គណនេយ្យ (${user.email}) ដើម្បីលុបទិន្នន័យទាំងអស់៖`);
                
                if (passwordInput === null) {
                    return; // អ្នកប្រើប្រាស់ចុច Cancel
                }
                
                if (passwordInput.trim() === '') {
                    alert('អ្នកត្រូវតែបញ្ចូលលេខសម្ងាត់!');
                    return;
                }

                try {
                    // ផ្ទៀងផ្ទាត់លេខសម្ងាត់ឡើងវិញ
                    const credential = window.FirebaseAPI.EmailAuthProvider.credential(user.email, passwordInput);
                    await window.FirebaseAPI.reauthenticateWithCredential(user, credential);
                    
                    if (window.confirm('🚨 ការផ្ទៀងផ្ទាត់ជោគជ័យ។ តើអ្នកពិតជាចង់លុបទិន្នន័យទាំងអស់ (គ្រូ, ថ្នាក់រៀន, មុខវិជ្ជា និងកាលវិភាគ) មែនទេ?\n\nបញ្ជាក់៖ ទិន្នន័យដែលលុបហើយមិនអាចទាញមកវិញបានទេ!')) {
                        setTeachers([]);
                        setClasses([]);
                        setSchedules({});
                        setAllSubjects([]);
                        setActiveTab('teachers');
                        
                        // Force Save immediately to Firebase
                        if (window.FirebaseAPI) {
                            const appId = "kob_schedule_app";
                            const docRef = window.FirebaseAPI.doc(db, 'artifacts', appId, 'users', user.uid, 'schoolData', 'main');
                            
                            await window.FirebaseAPI.setDoc(docRef, {
                                teachers: [],
                                classes: [],
                                schedules: {},
                                allSubjects: [],
                                isSidebarOpen: isSidebarOpen,
                                schoolProfile: schoolProfile,
                                updatedAt: new Date().toISOString()
                            });
                            alert('ទិន្នន័យទាំងអស់ត្រូវបានលុបស្អាតរលីង!');
                        }
                    }
                } catch (error) {
                    console.error("Authentication Error:", error);
                    alert('លេខសម្ងាត់មិនត្រឹមត្រូវទេ! ការលុបទិន្នន័យត្រូវបានបដិសេធ។');
                }
            };

            const addCustomSubject = (sub) => {
                if (!allSubjects.includes(sub)) {
                    setAllSubjects([...allSubjects, sub]);
                }
            };

            const handleImportData = (newClasses, newSubjects) => {
                setAllSubjects(newSubjects);
                setClasses(prev => [...prev, ...newClasses]);
            };

            const clearSchedule = () => {
                if (window.confirm('តើអ្នកពិតជាចង់លុបទិន្នន័យកាលវិភាគដែលបានរៀបចំរួចមែនទេ? (វាមិនប៉ះពាល់ដល់ទិន្នន័យគ្រូ និងថ្នាក់រៀនទេ)')) {
                    setSchedules({});
                }
            };

            // Scheduling Algorithm
            const generateSchedule = () => {
                if (classes.length === 0) {
                    alert('សូមបញ្ចូលថ្នាក់រៀនជាមុនសិន!');
                    return;
                }
                if (teachers.length === 0) {
                    alert('សូមបញ្ចូលគ្រូបង្រៀនជាមុនសិន!');
                    return;
                }

                const newSchedules = {};
                let unassignedCount = 0;

                // Track teacher hours to distribute evenly and respect max limits
                const teacherHoursAssigned = {};
                teachers.forEach(t => teacherHoursAssigned[t.id] = 0);

                classes.forEach(cls => {
                    newSchedules[cls.id] = {};
                    DAYS.forEach(day => {
                        newSchedules[cls.id][day] = {};
                    });

                    // Create list of required hours
                    const demands = [];
                    Object.entries(cls.subjectHours).forEach(([subject, hours]) => {
                        for (let i = 0; i < hours; i++) {
                            demands.push({ subject, level: cls.level, classId: cls.id });
                        }
                    });

                    // Try to place each demand
                    demands.forEach(demand => {
                        // Find available teachers for this subject and class
                        let availableTeachers = teachers.filter(t => {
                            // ប្រើទម្រង់ថ្មី assignments
                            if (t.assignments && t.assignments.length > 0) {
                                return t.assignments.some(a => 
                                    a.subject === demand.subject && 
                                    (a.allowedClasses.length === 0 || a.allowedClasses.includes(demand.classId))
                                );
                            }
                            // ទម្រង់ចាស់ (សម្រាប់ទិន្នន័យដែលបានបញ្ចូលពីមុន)
                            const matchSubject = t.subjects && t.subjects.includes(demand.subject);
                            let matchClass = true; // លំនាំដើមបង្រៀនគ្រប់ថ្នាក់
                            if (t.subjectClasses && t.subjectClasses[demand.subject] && t.subjectClasses[demand.subject].length > 0) {
                                matchClass = t.subjectClasses[demand.subject].includes(demand.classId);
                            } else if (t.allowedClasses && t.allowedClasses.length > 0) {
                                matchClass = t.allowedClasses.includes(demand.classId);
                            }
                            return matchSubject && matchClass;
                        });

                        // Sort teachers by hours assigned (to distribute evenly)
                        availableTeachers.sort((a, b) => teacherHoursAssigned[a.id] - teacherHoursAssigned[b.id]);

                        let placed = false;
                        
                        // Try placing without exceeding max hours first
                        for (let attempt = 1; attempt <= 2; attempt++) {
                            if (placed) break;
                            
                            for (let tIdx = 0; tIdx < availableTeachers.length; tIdx++) {
                                const teacher = availableTeachers[tIdx];
                                
                                // Attempt 1: Strict on max hours. Attempt 2: Allow overtime
                                if (attempt === 1 && teacherHoursAssigned[teacher.id] >= (teacher.maxHours || 20)) {
                                    continue;
                                }

                                // Find a free slot in the class schedule
                                for (let dIdx = 0; dIdx < DAYS.length; dIdx++) {
                                    const dayName = DAYS[dIdx];
                                    const isMorningDay = dayName.includes('ព្រឹក');
                                    
                                    for (let sIdx = 0; sIdx < SLOTS.length; sIdx++) {
                                        const slot = SLOTS[sIdx];
                                        const slotId = slot.id;
                                        
                                        // Match slot type with day type
                                        if ((isMorningDay && slot.type !== 'Morning') || (!isMorningDay && slot.type !== 'Afternoon')) {
                                            continue;
                                        }

                                        // Check if class is free
                                        if (!newSchedules[cls.id][dayName][slotId]) {
                                            
                                            // Check if teacher is specific off this slot
                                            let isTeacherOff = false;
                                            if (teacher.specificSlotsOff && teacher.specificSlotsOff[dayName] && teacher.specificSlotsOff[dayName].includes(slotId)) {
                                                isTeacherOff = true;
                                            }

                                            // Check if teacher is already teaching in another class at this exact time
                                            let teacherConflict = false;
                                            for (const otherClsId in newSchedules) {
                                                if (newSchedules[otherClsId][dayName] && newSchedules[otherClsId][dayName][slotId]?.teacherId === teacher.id) {
                                                    teacherConflict = true;
                                                    break;
                                                }
                                            }

                                            if (!isTeacherOff && !teacherConflict) {
                                                newSchedules[cls.id][dayName][slotId] = {
                                                    subject: demand.subject,
                                                    teacherId: teacher.id,
                                                    teacherName: teacher.name,
                                                    isOvertime: teacherHoursAssigned[teacher.id] >= (teacher.maxHours || 20)
                                                };
                                                teacherHoursAssigned[teacher.id]++;
                                                placed = true;
                                                break;
                                            }
                                        }
                                    }
                                    if (placed) break;
                                }
                                if (placed) break;
                            }
                        }

                        if (!placed) {
                            unassignedCount++;
                        }
                    });
                });

        function SettingsManager({ schoolProfile, setSchoolProfile }) {
            const handleChange = (e) => {

                setSchoolProfile(prev => ({ ...prev, [name]: value }));
            };

            return (
                <div className="bg-white p-5 sm:p-8 rounded-xl shadow-sm border border-gray-100 max-w-3xl mx-auto h-full overflow-y-auto">

                    <div className="space-y-6">
                        <div>
                            <label className="block text-sm font-bold text-gray-700 mb-2">ឈ្មោះសាលារៀន (ឧ. វិទ្យាល័យកូប)</label>
                            <input type="text" name="name" value={schoolProfile.name} onChange={handleChange} className="w-full border-2 border-gray-200 p-3 rounded-xl focus:ring-0 focus:border-blue-500 transition-colors font-bold text-lg" placeholder="បញ្ជូលឈ្មោះសាលារៀន" />
                        </div>
                        
                        <div>
                            <label className="block text-sm font-bold text-gray-700 mb-2">មន្ទីរអប់រំ / ស្ថាប័នគ្រប់គ្រង (ឧ. មន្ទីរអប់រំ យុវជន និងកីឡាខេត្តបន្ទាយមានជ័យ)</label>
                            <input type="text" name="department" value={schoolProfile.department} onChange={handleChange} className="w-full border-2 border-gray-200 p-3 rounded-xl focus:ring-0 focus:border-blue-500 transition-colors" placeholder="បញ្ជូលស្ថាប័នគ្រប់គ្រង" />
                        </div>

                        <div>
                            <label className="block text-sm font-bold text-gray-700 mb-2">ឆ្នាំសិក្សា (ឧ. ២០២៤ - ២០២៥)</label>
                            <input type="text" name="academicYear" value={schoolProfile.academicYear} onChange={handleChange} className="w-full border-2 border-gray-200 p-3 rounded-xl focus:ring-0 focus:border-blue-500 transition-colors" placeholder="បញ្ជូលឆ្នាំសិក្សា" />
                        </div>
                    </div>

                    <div className="mt-8 p-4 bg-blue-50 rounded-xl border border-blue-100">
                        <h3 className="font-bold text-blue-800 mb-2 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" /></svg>
                            ចំណាំ៖
                        </h3>
                        <p className="text-sm text-blue-700 leading-relaxed">រាល់ការផ្លាស់ប្តូរទិន្នន័យនៅទីនេះ នឹងត្រូវបានរក្សាទុកដោយស្វ័យប្រវត្តិ។ គណនេយ្យនីមួយៗ (តាមរយៈអ៊ីមែល) នឹងមានទិន្នន័យផ្សេងៗគ្នា ដូច្នេះលោកអ្នកអាចគ្រប់គ្រងសាលារៀនច្រើនក្នុងពេលតែមួយបានដោយគ្រាន់តែបង្កើតគណនេយ្យ (អ៊ីមែល) ផ្សេងគ្នា។</p>
                    </div>
                </div>
            );
        }

        // ================= Subject Manager Components =================
        function SubjectManager({ allSubjects, addCustomSubject, updateSubject, removeSubject }) {
            const [newSubject, setNewSubject] = useState('');
            const [editingSub, setEditingSub] = useState(null);
            const [editValue, setEditValue] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if (newSubject.trim()) {
                    addCustomSubject(newSubject.trim());
                    setNewSubject('');
                }
            };

            const handleSaveEdit = (oldName) => {
                if (editValue.trim() && editValue.trim() !== oldName) {
                    updateSubject(oldName, editValue.trim());
                }
                setEditingSub(null);
            };

            return (
                <div className="bg-white p-5 sm:p-6 rounded-xl shadow-sm border border-gray-100 max-w-5xl mx-auto h-full flex flex-col">
                    <h2 className="text-lg font-bold mb-4 text-blue-800 flex items-center gap-2 border-b pb-2 shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" /></svg>
                        បញ្ជីមុខវិជ្ជាសរុប ({allSubjects.length})
                    </h2>
                    
                    <form onSubmit={handleAdd} className="flex gap-3 mb-6 shrink-0">
                        <input type="text" value={newSubject} onChange={e => setNewSubject(e.target.value)} className="flex-1 border p-2.5 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-gray-50" placeholder="បញ្ចូលឈ្មោះមុខវិជ្ជាថ្មី..." required />
                        <button type="submit" className="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-bold shadow-md hover:bg-blue-700 transition-colors flex gap-2 items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                            បន្ថែមមុខវិជ្ជា
                        </button>
                    </form>

                    <div className="overflow-y-auto flex-1 custom-scrollbar pr-2">
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pb-4">
                            {allSubjects.map(sub => (
                                <div key={sub} className="flex items-center justify-between p-3 border rounded-xl bg-white shadow-sm hover:border-blue-300 transition-all group">
                                    {editingSub === sub ? (
                                        <input 
                                            type="text" 
                                            value={editValue} 
                                            onChange={e => setEditValue(e.target.value)} 
                                            onKeyPress={e => e.key === 'Enter' && handleSaveEdit(sub)}
                                            onBlur={() => handleSaveEdit(sub)}
                                            autoFocus
                                            className="border-2 border-blue-400 p-1.5 rounded w-full text-sm font-bold outline-none"
                                        />
                                    ) : (
                                        <span className="font-bold text-gray-700">{sub}</span>
                                    )}
                                    
                                    {editingSub !== sub && (
                                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-2 shrink-0">
                                            <button onClick={() => { setEditingSub(sub); setEditValue(sub); }} className="p-1.5 text-blue-500 hover:bg-blue-50 hover:text-blue-700 rounded-full transition-colors" title="កែប្រែ">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" /></svg>
                                            </button>
                                            <button onClick={() => removeSubject(sub)} className="p-1.5 text-red-400 hover:bg-red-50 hover:text-red-600 rounded-full transition-colors" title="លុប">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                                            </button>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ================= Teacher Components =================
        function TeacherManager({ classes, teachers, addTeacher, updateTeacher, removeTeacher, allSubjects, addCustomSubject }) {
            const [editingId, setEditingId] = useState(null);
            const [name, setName] = useState('');
            // ជំនួស State ចាស់ៗ
            const [assignments, setAssignments] = useState([]); // [{ subject: '', allowedClasses: [] }]
            const [newSubject, setNewSubject] = useState('');
            const [specificSlotsOff, setSpecificSlotsOff] = useState({});
            const [maxHours, setMaxHours] = useState(0);

            // គណនាម៉ោងបង្រៀនសរុបដោយស្វ័យប្រវត្តិ ផ្អែកលើតារាងបិទ/បើកម៉ោង
            useEffect(() => {
                let totalAvailableSlots = 0;
                // រាប់គ្រប់ម៉ោងក្នុង១សប្តាហ៍
                WEEK_DAYS.forEach(day => {
                    const morningDay = `${day} - ព្រឹក`;
                    const afternoonDay = `${day} - ល្ងាច`;

                    // រាប់ម៉ោងព្រឹក
                    MORNING_SLOTS.forEach(slot => {
                        const isOff = specificSlotsOff[morningDay] && specificSlotsOff[morningDay].includes(slot.id);
                        if (!isOff) totalAvailableSlots++;
                    });
                    
                    // រាប់ម៉ោងល្ងាច
                    AFTERNOON_SLOTS.forEach(slot => {
                        const isOff = specificSlotsOff[afternoonDay] && specificSlotsOff[afternoonDay].includes(slot.id);
                        if (!isOff) totalAvailableSlots++;
                    });
                });
                
                setMaxHours(totalAvailableSlots);
            }, [specificSlotsOff]);

            const handleSubmit = (e) => {
                e.preventDefault();
                // តម្រូវឱ្យមានឈ្មោះ និងមុខវិជ្ជាយ៉ាងហោចណាស់១ ដែលមានទិន្នន័យ
                const validAssignments = assignments.filter(a => a.subject !== '');
                if (!name || validAssignments.length === 0) {
                    alert('សូមបញ្ចូលឈ្មោះគ្រូ និងជ្រើសរើសមុខវិជ្ជាយ៉ាងហោចណាស់មួយ!');
                    return;
                }
                
                // បំប្លែង Assignments ទៅជាទម្រង់ទិន្នន័យចាស់ ដើម្បីកុំឱ្យខូចកូដ Algorithm
                const subjects = validAssignments.map(a => a.subject);
                const subjectClasses = {};
                validAssignments.forEach(a => {
                    subjectClasses[a.subject] = a.allowedClasses;
                });

                if (editingId) {
                    updateTeacher(editingId, { name, subjects, subjectClasses, specificSlotsOff, maxHours, assignments: validAssignments });
                    setEditingId(null);
                } else {
                    addTeacher({ name, subjects, subjectClasses, specificSlotsOff, maxHours, assignments: validAssignments });
                }
                
                // Reset form
                setName('');
                setAssignments([]);
                setSpecificSlotsOff({});
                setMaxHours(0);
            };

            const handleEdit = (teacher) => {
                setName(teacher.name);
                
                // បម្លែងទិន្នន័យចាស់មកថ្មី បើចាំបាច់
                if (teacher.assignments) {
                    setAssignments(teacher.assignments);
                } else if (teacher.subjects) {
                    const mappedAssignments = teacher.subjects.map(sub => ({
                        subject: sub,
                        allowedClasses: teacher.subjectClasses?.[sub] || teacher.allowedClasses || []
                    }));
                    setAssignments(mappedAssignments);
                } else {
                    setAssignments([]);
                }
                
                setSpecificSlotsOff(teacher.specificSlotsOff || {});
                setMaxHours(teacher.maxHours || 0);
                setEditingId(teacher.id);
            };

            const cancelEdit = () => {
                setEditingId(null);
                setName('');
                setAssignments([]);
                setSpecificSlotsOff({});
                setMaxHours(0);
            };

            const handleAddCustomSubject = () => {
                if (newSubject.trim()) {
                    addCustomSubject(newSubject.trim());
                    // មិនចាំបាច់ add ចូល assignments ទេ ទុកឲ្យ user រើសខ្លួនឯង
                    setNewSubject('');
                }
            };

            const addAssignment = () => {
                setAssignments([...assignments, { subject: '', allowedClasses: [] }]);
            };

            const removeAssignment = (index) => {
                const newAssignments = [...assignments];
                newAssignments.splice(index, 1);
                setAssignments(newAssignments);
            };

            const updateAssignmentSubject = (index, newSubject) => {
                const newAssignments = [...assignments];
                newAssignments[index].subject = newSubject;
                setAssignments(newAssignments);
            };

            const toggleAssignmentClass = (assignmentIndex, classId) => {
                const newAssignments = [...assignments];
                const currentClasses = newAssignments[assignmentIndex].allowedClasses;
                
                if (currentClasses.includes(classId)) {
                    newAssignments[assignmentIndex].allowedClasses = currentClasses.filter(id => id !== classId);
                } else {
                    newAssignments[assignmentIndex].allowedClasses = [...currentClasses, classId];
                }
                setAssignments(newAssignments);
            };

            const toggleSpecificSlot = (day, slotId) => {
                const newOff = { ...specificSlotsOff };
                if (!newOff[day]) newOff[day] = [];
                
                if (newOff[day].includes(slotId)) {
                    newOff[day] = newOff[day].filter(id => id !== slotId);
                } else {
                    newOff[day].push(slotId);
                }
                setSpecificSlotsOff(newOff);
            };

            return (
                <div className="flex flex-col lg:flex-row gap-6 h-full">
                    <style>{`
                        @media print {
                            body, html, #root, .h-screen, .overflow-hidden, .overflow-auto, main { height: auto !important; overflow: visible !important; display: block !important; }
                            .print-hide-border { border: none !important; box-shadow: none !important; padding: 0 !important; background: transparent !important; }
                            .print-hidden-section { display: none !important; }
                        }
                    `}</style>
                    {/* Form Section */}
                    <div className="w-full lg:w-[70%] bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col shrink-0 overflow-y-auto custom-scrollbar print-hidden-section" style={{maxHeight: 'calc(100vh - 120px)'}}>
                        <h2 className="text-lg font-bold mb-4 text-blue-800 flex items-center gap-2 border-b pb-2 sticky top-0 bg-white z-10">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 0110.374 21c-2.331 0-4.512-.645-6.374-1.766z" /></svg>
                            {editingId ? 'កែប្រែទិន្នន័យគ្រូបង្រៀន' : 'បន្ថែមគ្រូបង្រៀនថ្មី'}
                        </h2>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">ឈ្មោះគ្រូបង្រៀន</label>
                                <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full border p-2 rounded focus:ring-blue-500 focus:border-blue-500" placeholder="ឧ. លោកគ្រូ ក" required />
                            </div>
                            
                            <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                                <div className="flex justify-between items-center mb-4">
                                    <label className="block text-sm font-bold text-gray-700">មុខវិជ្ជា និង ថ្នាក់ដែលគាត់បង្រៀន</label>
                                    <button type="button" onClick={addAssignment} className="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-200 transition-colors flex items-center gap-1 border border-indigo-200">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                                        បន្ថែមមុខវិជ្ជា
                                    </button>
                                </div>

                                {assignments.length === 0 ? (
                                    <div className="text-center p-4 bg-white rounded-lg border border-dashed text-gray-500 text-sm">សូមចុចប៊ូតុង "បន្ថែមមុខវិជ្ជា" ខាងលើ</div>
                                ) : (
                                    <div className="space-y-4">
                                        {assignments.map((assignment, idx) => (
                                            <div key={idx} className="bg-white p-3 rounded-lg border shadow-sm relative">
                                                <button type="button" onClick={() => removeAssignment(idx)} className="absolute -top-2 -right-2 bg-red-100 text-red-600 rounded-full p-1 border border-red-200 hover:bg-red-200 transition-colors" title="លុបមុខវិជ្ជានេះ">
                                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                                                </button>
                                                
                                                <div className="mb-3">
                                                    <span className="inline-block bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded-full font-bold mb-1">មុខវិជ្ជាទី {idx + 1}</span>
                                                    <select 
                                                        value={assignment.subject} 
                                                        onChange={e => updateAssignmentSubject(idx, e.target.value)} 
                                                        className="w-full border p-2 rounded focus:ring-blue-500 focus:border-blue-500 font-bold text-sm bg-gray-50"
                                                        required
                                                    >
                                                        <option value="" disabled>-- ជ្រើសរើសមុខវិជ្ជា --</option>
                                                        {allSubjects.map(s => <option key={s} value={s}>{s}</option>)}
                                                    </select>
                                                </div>

                                                <div className="border-t pt-2 mt-2">
                                                    <label className="block text-xs font-bold text-gray-600 mb-2">បង្រៀននៅថ្នាក់៖ <span className="text-[10px] font-normal italic text-gray-400">(បើមិនរើស = បង្រៀនគ្រប់ថ្នាក់)</span></label>
                                                    {classes.length === 0 ? (
                                                        <div className="text-xs text-red-500 italic bg-red-50 p-2 rounded">សូមបង្កើតថ្នាក់រៀនជាមុនសិន។</div>
                                                    ) : (
                                                        <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto custom-scrollbar">
                                                            {classes.map(c => (
                                                                <button 
                                                                    key={c.id} 
                                                                    type="button" 
                                                                    onClick={() => toggleAssignmentClass(idx, c.id)} 
                                                                    className={`px-2 py-1 text-[11px] rounded border transition-colors ${assignment.allowedClasses.includes(c.id) ? 'bg-indigo-100 border-indigo-300 text-indigo-800 font-bold' : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'}`}
                                                                >
                                                                    ថ្នាក់ {c.name}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <div className="mt-4 pt-3 border-t border-dashed flex gap-2">
                                    <input type="text" value={newSubject} onChange={e => setNewSubject(e.target.value)} onKeyPress={e => e.key === 'Enter' && (e.preventDefault(), handleAddCustomSubject())} className="flex-1 border p-1.5 rounded text-sm" placeholder="វាយបញ្ចូលមុខវិជ្ជាថ្មី បើរកមិនឃើញ..." />
                                    <button type="button" onClick={handleAddCustomSubject} className="bg-gray-200 px-3 rounded text-sm font-bold hover:bg-gray-300">បន្ថែមចូលបញ្ជី</button>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">ម៉ោងបង្រៀនសរុបប្រចាំសប្តាហ៍ (គណនាស្វ័យប្រវត្តិពីតារាងខាងក្រោម)</label>

        // ================= Schedule Viewer Components =================
        function ScheduleViewer({ classes, teachers, schedules, generateSchedule, schoolProfile, clearSchedule }) {
            const [viewType, setViewType] = useState('class'); // 'class', 'teacher', 'master'
            const [selectedClassId, setSelectedClassId] = useState(classes.length > 0 ? classes[0].id : null);
            const [selectedTeacherId, setSelectedTeacherId] = useState(teachers && teachers.length > 0 ? teachers[0].id : null);
            const [selectedMasterDay, setSelectedMasterDay] = useState(DAYS[0]);

            useEffect(() => {
                if (classes.length > 0 && !classes.find(c => c.id === selectedClassId)) {
                    setSelectedClassId(classes[0].id);
                }
            }, [classes, selectedClassId]);

            useEffect(() => {
                if (teachers && teachers.length > 0 && !teachers.find(t => t.id === selectedTeacherId)) {
                    setSelectedTeacherId(teachers[0].id);
                }
            }, [teachers, selectedTeacherId]);

            if (classes.length === 0) {
                return (
                    <div className="bg-white p-10 rounded-xl shadow-sm border border-gray-100 text-center flex flex-col items-center justify-center min-h-[60vh]">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-16 h-16 text-gray-300 mb-4"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        <h3 className="text-xl font-bold text-gray-700 mb-2">មិនទាន់មានថ្នាក់រៀនទេ</h3>
                        <p className="text-gray-500">សូមចូលទៅកាន់ម៉ឺនុយ "ថ្នាក់រៀន" ដើម្បីបង្កើតថ្នាក់ជាមុនសិន។</p>
                    </div>
                );
            }

            const activeClass = classes.find(c => c.id === selectedClassId);
            const activeTeacher = teachers?.find(t => t.id === selectedTeacherId);
            
            const isScheduleEmpty = Object.keys(schedules).length === 0;

            const getTeacherCell = (tId, day, slotId) => {
                if (!schedules) return null;
                for (const classId in schedules) {
                    const cell = schedules[classId][day]?.[slotId];
                    if (cell && cell.teacherId === tId) {
                        const cls = classes.find(c => c.id === classId);
                        return { subject: cell.subject, className: cls ? cls.name : 'Unknown' };
                    }
                }
                return null;
            };

            const isMasterMorning = selectedMasterDay.includes('ព្រឹក');
            const masterSlots = SLOTS.filter(s => s.type === (isMasterMorning ? 'Morning' : 'Afternoon'));

            // Calculate total teaching hours for selected teacher
            let teacherTotalHours = 0;
            if (viewType === 'teacher' && schedules && activeTeacher) {
                for (const classId in schedules) {
                    for (const day in schedules[classId]) {
                        for (const slotId in schedules[classId][day]) {
                            if (schedules[classId][day][slotId].teacherId === activeTeacher.id) {
                                teacherTotalHours++;
                            }
                        }
                    }
                }
            }

            // Calculate total teaching hours for selected class
            let classTotalHours = 0;
            if (viewType === 'class' && schedules && activeClass) {
                const classSched = schedules[activeClass.id];
                if (classSched) {
                    for (const day in classSched) {
                        classTotalHours += Object.keys(classSched[day] || {}).length;
                    }
                }
            }

            return (
                <div className="bg-white p-5 sm:p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col overflow-hidden print-overflow-visible print:border-none print:shadow-none print:p-0" style={{maxHeight: 'calc(100vh - 120px)'}}>
                    {/* Header Controls */}
                    <div className="flex flex-col xl:flex-row justify-between items-center mb-6 border-b pb-4 gap-4 no-print shrink-0">
                        <div className="flex gap-2 bg-gray-100 p-1.5 rounded-lg w-full xl:w-auto">
                            <button onClick={() => setViewType('class')} className={`flex-1 xl:flex-none px-4 py-2 rounded-md font-bold text-sm transition-colors ${viewType === 'class' ? 'bg-white text-blue-800 shadow-sm' : 'text-gray-600 hover:text-blue-600 hover:bg-gray-200'}`}>តាមថ្នាក់</button>
                            <button onClick={() => setViewType('teacher')} className={`flex-1 xl:flex-none px-4 py-2 rounded-md font-bold text-sm transition-colors ${viewType === 'teacher' ? 'bg-white text-blue-800 shadow-sm' : 'text-gray-600 hover:text-blue-600 hover:bg-gray-200'}`}>តាមគ្រូ</button>
                            <button onClick={() => setViewType('master')} className={`flex-1 xl:flex-none px-4 py-2 rounded-md font-bold text-sm transition-colors ${viewType === 'master' ? 'bg-white text-blue-800 shadow-sm' : 'text-gray-600 hover:text-blue-600 hover:bg-gray-200'}`}>តារាងរួម</button>
                        </div>

                        <div className="flex flex-wrap gap-3 w-full xl:w-auto justify-center xl:justify-end">
                            {viewType === 'class' && (
                                <select value={selectedClassId || ''} onChange={e => setSelectedClassId(e.target.value)} className="border-2 border-blue-200 p-2 rounded-lg bg-blue-50 font-bold focus:border-blue-500 focus:ring-0 text-blue-800">
                                    {classes.map(c => <option key={c.id} value={c.id}>ថ្នាក់ទី {c.name}</option>)}
                                </select>
                            )}
                            {viewType === 'teacher' && (
                                <select value={selectedTeacherId || ''} onChange={e => setSelectedTeacherId(e.target.value)} className="border-2 border-blue-200 p-2 rounded-lg bg-blue-50 font-bold focus:border-blue-500 focus:ring-0 text-blue-800">
                                    {teachers?.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                </select>
                            )}
                            {viewType === 'master' && (
                                <select value={selectedMasterDay || ''} onChange={e => setSelectedMasterDay(e.target.value)} className="border-2 border-blue-200 p-2 rounded-lg bg-blue-50 font-bold focus:border-blue-500 focus:ring-0 text-blue-800">
                                    {DAYS.map(d => <option key={d} value={d}>{d}</option>)}
