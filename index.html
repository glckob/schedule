    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        // បញ្ជូនវាទៅ window ដើម្បីអាចប្រើក្នុង React (Babel) បាន
        window.FirebaseAPI = { initializeApp, getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, EmailAuthProvider, reauthenticateWithCredential, getFirestore, doc, setDoc, getDoc };
    </script>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const WEEK_DAYS = ['ច័ន្ទ', 'អង្គារ', 'ពុធ', 'ព្រហស្បតិ៍', 'សុក្រ', 'សៅរ៍'];
        const DAYS = ['ច័ន្ទ - ព្រឹក', 'ច័ន្ទ - ល្ងាច', 'អង្គារ - ព្រឹក', 'អង្គារ - ល្ងាច', 'ពុធ - ព្រឹក', 'ពុធ - ល្ងាច', 'ព្រហស្បតិ៍ - ព្រឹក', 'ព្រហស្បតិ៍ - ល្ងាច', 'សុក្រ - ព្រឹក', 'សុក្រ - ល្ងាច', 'សៅរ៍ - ព្រឹក'];
        
        const SLOTS = [
            { id: 'm1', name: 'ម៉ោង ៧:០០ - ៨:០០', type: 'Morning', time: '០៧-០៨' },
            { id: 'm2', name: 'ម៉ោង ៨:០០ - ៩:០០', type: 'Morning', time: '០៨-០៩' },
            { id: 'm3', name: 'ម៉ោង ៩:០០ - ១០:០០', type: 'Morning', time: '០៩-១០' },
            { id: 'm4', name: 'ម៉ោង ១០:០០ - ១១:០០', type: 'Morning', time: '១០-១១' },
            { id: 'a1', name: 'ម៉ោង ១៣:០០ - ១៤:០០', type: 'Afternoon', time: '១៣-១៤' },
            { id: 'a2', name: 'ម៉ោង ១៤:០០ - ១៥:០០', type: 'Afternoon', time: '១៤-១៥' },
            { id: 'a3', name: 'ម៉ោង ១៥:០០ - ១៦:០០', type: 'Afternoon', time: '១៥-១៦' }
        ];

        const MORNING_SLOTS = SLOTS.filter(s => s.type === 'Morning');
        const AFTERNOON_SLOTS = SLOTS.filter(s => s.type === 'Afternoon');

        const DEFAULT_SUBJECTS = ['គណិតវិទ្យា', 'រូបវិទ្យា', 'គីមីវិទ្យា', 'ជីវវិទ្យា', 'ផែនដីវិទ្យា', 'ភាសាខ្មែរ', 'សីលធម៌', 'ប្រវត្តិវិទ្យា', 'ភូមិវិទ្យា', 'ភាសាអង់គ្លេស', 'កុំព្យូទ័រ', 'កីឡា', 'កសិកម្ម', 'សេដ្ឋកិច្ច', 'ភាសាបារាំង', 'សិល្បៈ', 'អប់រំសុខភាព'];

        // ការកំណត់គម្រោង Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD5i1ppcMcyheAeepyuXEfrnIZWNZVz82s",
            authDomain: "schedule-bc5d1.firebaseapp.com",
            projectId: "schedule-bc5d1",
            storageBucket: "schedule-bc5d1.firebasestorage.app",
            messagingSenderId: "940407397764",
            appId: "1:940407397764:web:08751ec6b4031ec75991d1",
            measurementId: "G-VTG50H7JNP"
        };

        let app, db, auth;

        function App() {
            const [activeTab, setActiveTab] = useState('subjects');
            const [teachers, setTeachers] = useState([]);
            const [classes, setClasses] = useState([]);
            const [schedules, setSchedules] = useState({});
            const [allSubjects, setAllSubjects] = useState(DEFAULT_SUBJECTS);
            const [isLoaded, setIsLoaded] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [user, setUser] = useState(null);
            
            const [schoolProfile, setSchoolProfile] = useState({
                name: 'ឈ្មោះសាលារៀន',
                department: 'មន្ទីរអប់រំ យុវជន និងកីឡាខេត្ត...',
                academicYear: '២០២៤ - ២០២៥'
            });
            
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);

            useEffect(() => {
                let unsubscribeAuth = null;
                let isMounted = true;
                
                const initFirebase = () => {
                    if (window.FirebaseAPI && window.FirebaseAPI.onAuthStateChanged) {
                        try {
                            if (!app) {
                                app = window.FirebaseAPI.initializeApp(firebaseConfig);
                            }
                            if (!auth) auth = window.FirebaseAPI.getAuth(app);
                            if (!db) db = window.FirebaseAPI.getFirestore(app);

                            unsubscribeAuth = window.FirebaseAPI.onAuthStateChanged(auth, async (currentUser) => {
                                if (!isMounted) return;

                                if (currentUser) {
                                    const appId = "kob_schedule_app"; 
                                    const docRef = window.FirebaseAPI.doc(db, 'artifacts', appId, 'users', currentUser.uid, 'schoolData', 'main');
                                    
                                    try {
                                        const docSnap = await window.FirebaseAPI.getDoc(docRef);
                                        if (docSnap.exists()) {
                                            const data = docSnap.data();
                                            if (data.teachers) setTeachers(data.teachers);
                                            if (data.classes) setClasses(data.classes);
                                            if (data.schedules) setSchedules(data.schedules);
                                            if (data.allSubjects !== undefined && Array.isArray(data.allSubjects)) {
                                                setAllSubjects(data.allSubjects); 
                                            } else {
                                                setAllSubjects(DEFAULT_SUBJECTS);
                                            }
                                            if (data.isSidebarOpen !== undefined) setIsSidebarOpen(data.isSidebarOpen);
                                            if (data.schoolProfile) setSchoolProfile(data.schoolProfile);
                                        } else {
                                             await window.FirebaseAPI.setDoc(docRef, {
                                                teachers: [],
                                                classes: [],
                                                schedules: {},
                                                allSubjects: DEFAULT_SUBJECTS,
                                                isSidebarOpen: true,
                                                schoolProfile: { name: 'ឈ្មោះសាលារៀន', department: 'មន្ទីរអប់រំ យុវជន និងកីឡាខេត្ត...', academicYear: '២០២៤ - ២០២៥' },
                                                updatedAt: new Date().toISOString()
                                            });
                                        }
                                    } catch (error) {
                                        console.error("Firestore getDoc Error:", error);
                                    }
                                    
                                    setUser(currentUser);
                                    setTimeout(() => {
                                        if (isMounted) setIsLoaded(true);
                                    }, 100);
                                } else {
                                    setUser(null);
                                    setIsLoaded(true);
                                }
                            });
                        } catch (err) {
                            console.error("Firebase Config Error:", err);
                        }
                    } else {
                        setTimeout(initFirebase, 100); 
                    }
                };

                initFirebase();

                return () => {
                    isMounted = false;
                    if (unsubscribeAuth) unsubscribeAuth();
                };
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                setIsLoggingIn(true);
                try {
                    await window.FirebaseAPI.signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    console.error("Login Error:", error);
                    setLoginError('អ៊ីមែល ឬ លេខសម្ងាត់មិនត្រឹមត្រូវទេ។ សូមព្យាយាមម្តងទៀត។');
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleLogout = () => {
                if (window.confirm('តើអ្នកពិតជាចង់ចាកចេញមែនទេ?')) {
                    window.FirebaseAPI.signOut(auth).catch(error => console.error("Logout Error:", error));
                }
            };

            useEffect(() => {
                if (!isLoaded || !user || !window.FirebaseAPI) return;
                const saveTimer = setTimeout(() => {
                    const appId = "kob_schedule_app";
                    const docRef = window.FirebaseAPI.doc(db, 'artifacts', appId, 'users', user.uid, 'schoolData', 'main');
                    
                    window.FirebaseAPI.setDoc(docRef, {
                        teachers,
                        classes,
                        schedules,
                        allSubjects,
                        isSidebarOpen,
                        schoolProfile,
                        updatedAt: new Date().toISOString()
                    }).catch(err => console.error("Error saving data:", err));
                }, 500);

                return () => clearTimeout(saveTimer);
            }, [teachers, classes, schedules, allSubjects, isSidebarOpen, schoolProfile, isLoaded, user]);

            const addTeacher = (teacher) => setTeachers([...teachers, { ...teacher, id: Date.now().toString() }]);
            
            const removeTeacher = (id) => {
                if (confirm('តើអ្នកពិតជាចង់លុបគ្រូនេះមែនទេ?')) {
                    setTeachers(teachers.filter(t => t.id !== id));
                }
            };

            const addClass = (cls) => setClasses([...classes, { ...cls, id: Date.now().toString() }]);

            const removeClass = (id) => {
                if (confirm('តើអ្នកពិតជាចង់លុបថ្នាក់នេះមែនទេ?')) {
                    setClasses(classes.filter(c => c.id !== id));
                    const newSchedules = { ...schedules };
                    delete newSchedules[id];
                    setSchedules(newSchedules);
                }
            };

            const updateTeacher = (id, updatedTeacher) => setTeachers(teachers.map(t => t.id === id ? { ...updatedTeacher, id } : t));
            const updateClass = (id, updatedClass) => setClasses(classes.map(c => c.id === id ? { ...updatedClass, id } : c));

            const updateSubject = (oldName, newName) => {
                if (allSubjects.includes(newName)) {
                    alert('ឈ្មោះមុខវិជ្ជានេះមានរួចហើយ!');
                    return;
                }
                setAllSubjects(allSubjects.map(s => s === oldName ? newName : s));
                setTeachers(teachers.map(t => ({
                    ...t,
                    subjects: t.subjects ? t.subjects.map(s => s === oldName ? newName : s) : []
                })));
                setClasses(classes.map(c => {
                    const newHours = { ...c.subjectHours };
                    if (newHours[oldName] !== undefined) {
                        newHours[newName] = newHours[oldName];
                        delete newHours[oldName];
                    }
                    const newRules = { ...c.subjectRules };
                    if (newRules[oldName]) {
                        newRules[newName] = newRules[oldName];
                        delete newRules[oldName];
                    }
                    return { ...c, subjectHours: newHours, subjectRules: newRules };
                }));
            };

            const removeSubject = (subjectName) => {
                if (confirm(`តើអ្នកពិតជាចង់លុបមុខវិជ្ជា "${subjectName}" មែនទេ?`)) {
                    setAllSubjects(allSubjects.filter(s => s !== subjectName));
                    setTeachers(teachers.map(t => ({
                        ...t,
                        subjects: t.subjects ? t.subjects.filter(s => s !== subjectName) : []
                    })));
                    setClasses(classes.map(c => {
                        const newHours = { ...c.subjectHours };
                        delete newHours[subjectName];
                        const newRules = { ...c.subjectRules };
                        delete newRules[subjectName];
                        return { ...c, subjectHours: newHours, subjectRules: newRules };
                    }));
                }
            };

            const handleDeleteAllData = async () => {
                if (!user) return;
                const passwordInput = window.prompt(`ដើម្បីបញ្ជាក់សុវត្ថិភាព សូមបញ្ចូលលេខសម្ងាត់សម្រាប់គណនេយ្យ (${user.email}) ដើម្បីលុបទិន្នន័យទាំងអស់៖`);
                if (passwordInput === null) return; 
                if (passwordInput.trim() === '') {
                    alert('អ្នកត្រូវតែបញ្ចូលលេខសម្ងាត់!');
                    return;
                }

                try {
                    const credential = window.FirebaseAPI.EmailAuthProvider.credential(user.email, passwordInput);
                    await window.FirebaseAPI.reauthenticateWithCredential(user, credential);
                    
                    if (window.confirm('🚨 ការផ្ទៀងផ្ទាត់ជោគជ័យ។ តើអ្នកពិតជាចង់លុបទិន្នន័យទាំងអស់ (គ្រូ, ថ្នាក់រៀន, មុខវិជ្ជា និងកាលវិភាគ) មែនទេ?\n\nបញ្ជាក់៖ ទិន្នន័យដែលលុបហើយមិនអាចទាញមកវិញបានទេ!')) {
                        setTeachers([]);
                        setClasses([]);
                        setSchedules({});
                        setAllSubjects([]);
                        setActiveTab('subjects');
                        
                        if (window.FirebaseAPI) {
                            const appId = "kob_schedule_app";
                            const docRef = window.FirebaseAPI.doc(db, 'artifacts', appId, 'users', user.uid, 'schoolData', 'main');
                            await window.FirebaseAPI.setDoc(docRef, {
                                teachers: [], classes: [], schedules: {}, allSubjects: [],
                                isSidebarOpen: isSidebarOpen, schoolProfile: schoolProfile, updatedAt: new Date().toISOString()
                            });
                            alert('ទិន្នន័យទាំងអស់ត្រូវបានលុបស្អាតរលីង!');
                        }
                    }
                } catch (error) {
                    console.error("Authentication Error:", error);
                    alert('លេខសម្ងាត់មិនត្រឹមត្រូវទេ! ការលុបទិន្នន័យត្រូវបានបដិសេធ។');
                }
            };

            const addCustomSubject = (sub) => {
                if (!allSubjects.includes(sub)) setAllSubjects([...allSubjects, sub]);
            };

            const handleImportData = (newClasses, newSubjects) => {
                setAllSubjects(newSubjects);
                setClasses(prev => [...prev, ...newClasses]);
            };

            const clearSchedule = () => {
                if (window.confirm('តើអ្នកពិតជាចង់លុបទិន្នន័យកាលវិភាគដែលបានរៀបចំរួចមែនទេ? (វាមិនប៉ះពាល់ដល់ទិន្នន័យគ្រូ និងថ្នាក់រៀនទេ)')) {
                    setSchedules({});
                }
            };

            // Scheduling Algorithm
            const generateSchedule = () => {
                if (classes.length === 0) {
                    alert('សូមបញ្ចូលថ្នាក់រៀនជាមុនសិន!');
                    return;
                }
                if (teachers.length === 0) {
                    alert('សូមបញ្ចូលគ្រូបង្រៀនជាមុនសិន!');
                    return;
                }

                const newSchedules = {};
                let unassignedCount = 0;
                const placedDayParts = {}; 
                const teacherHoursAssigned = {};
                teachers.forEach(t => teacherHoursAssigned[t.id] = 0);

                classes.forEach(cls => {
                    newSchedules[cls.id] = {};
                    placedDayParts[cls.id] = {};
                    DAYS.forEach(day => {
                        newSchedules[cls.id][day] = {};
                    });

                    const demands = [];
                    Object.entries(cls.subjectHours).forEach(([subject, totalHours]) => {
                        const rules = cls.subjectRules?.[subject] || { consecutive: 1, singleSession: false };
                        let remainingHours = totalHours;
                        
                        while (remainingHours > 0) {
                            let chunk = Math.min(remainingHours, rules.consecutive || 1);
                            demands.push({ subject, classId: cls.id, hoursToPlace: chunk, singleSession: rules.singleSession });
                            remainingHours -= chunk;
                        }
                    });

                    demands.forEach(demand => {
                        let availableTeachers = teachers.filter(t => {
                            if (t.assignments && t.assignments.length > 0) {
                                return t.assignments.some(a => 
                                    a.subject === demand.subject && 
                                    (a.allowedClasses.length === 0 || a.allowedClasses.includes(demand.classId))
                                );
                            }
                            const matchSubject = t.subjects && t.subjects.includes(demand.subject);
                            let matchClass = true;
                            if (t.subjectClasses && t.subjectClasses[demand.subject] && t.subjectClasses[demand.subject].length > 0) {
                                matchClass = t.subjectClasses[demand.subject].includes(demand.classId);
                            } else if (t.allowedClasses && t.allowedClasses.length > 0) {
                                matchClass = t.allowedClasses.includes(demand.classId);
                            }
                            return matchSubject && matchClass;
                        });

                        availableTeachers.sort((a, b) => teacherHoursAssigned[a.id] - teacherHoursAssigned[b.id]);

                        let placed = false;
                        for (let attempt = 1; attempt <= 2; attempt++) {
                            if (placed) break;
                            for (let tIdx = 0; tIdx < availableTeachers.length; tIdx++) {
                                const teacher = availableTeachers[tIdx];
                                if (attempt === 1 && teacherHoursAssigned[teacher.id] >= (teacher.requiredStateHours || teacher.maxHours || 20)) {
                                    continue;
                                }

                                for (let dIdx = 0; dIdx < DAYS.length; dIdx++) {
                                    const dayName = DAYS[dIdx];
                                    const dayBaseName = dayName.split(' - ')[0]; 
                                    const isMorning = dayName.includes('ព្រឹក');
                                    const sessionType = isMorning ? 'Morning' : 'Afternoon';

                                    if (demand.singleSession) {
                                        const sessionAlreadyPlaced = placedDayParts[cls.id][demand.subject]?.[dayBaseName];
                                        if (sessionAlreadyPlaced && sessionAlreadyPlaced !== sessionType) continue;
                                    }

                                    const applicableSlots = SLOTS.filter(s => s.type === sessionType);

                                    for (let sStart = 0; sStart <= applicableSlots.length - demand.hoursToPlace; sStart++) {
                                        let canPlaceBlock = true;
                                        let slotsToOccupy = [];

                                        for (let step = 0; step < demand.hoursToPlace; step++) {
                                            const slotId = applicableSlots[sStart + step].id;
                                            if (newSchedules[cls.id][dayName][slotId]) { canPlaceBlock = false; break; }
                                            if (teacher.specificSlotsOff?.[dayName]?.includes(slotId)) { canPlaceBlock = false; break; }
                                            let teacherConflict = false;
                                            for (const otherClsId in newSchedules) {
                                                if (newSchedules[otherClsId][dayName]?.[slotId]?.teacherId === teacher.id) {
                                                    teacherConflict = true; break;
                                                }
                                            }
                                            if (teacherConflict) { canPlaceBlock = false; break; }
                                            slotsToOccupy.push(slotId);
                                        }

                                        if (canPlaceBlock) {
                                            slotsToOccupy.forEach(slotId => {
                                                newSchedules[cls.id][dayName][slotId] = {
                                                    subject: demand.subject,
                                                    teacherId: teacher.id,
                                                    teacherName: teacher.name,
                                                    isOvertime: teacherHoursAssigned[teacher.id] >= (teacher.requiredStateHours || teacher.maxHours || 20)
                                                };
                                                teacherHoursAssigned[teacher.id]++;
                                            });

                                            if (!placedDayParts[cls.id][demand.subject]) placedDayParts[cls.id][demand.subject] = {};
                                            placedDayParts[cls.id][demand.subject][dayBaseName] = sessionType;

                                            placed = true;
                                            break;
                                        }
                                    }
                                    if (placed) break; 
                                }
                                if (placed) break; 
                            }
                        }

                        if (!placed) unassignedCount += demand.hoursToPlace;
                    });
                });

            const [editValue, setEditValue] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if (newSubject.trim()) {
                    addCustomSubject(newSubject.trim());
                    setNewSubject('');
                }
            };

            const handleSaveEdit = (oldName) => {
                if (editValue.trim() && editValue.trim() !== oldName) {
                    updateSubject(oldName, editValue.trim());
                }
                setEditingSub(null);
            };

            return (
                <div className="bg-white p-5 sm:p-6 rounded-xl shadow-sm border border-gray-100 max-w-5xl mx-auto h-full flex flex-col">
                    <h2 className="text-lg font-bold mb-4 text-blue-800 flex items-center gap-2 border-b pb-2 shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" /></svg>
                        បញ្ជីមុខវិជ្ជាសរុប ({allSubjects.length})
                    </h2>
                    <form onSubmit={handleAdd} className="flex gap-3 mb-6 shrink-0">
                        <input type="text" value={newSubject} onChange={e => setNewSubject(e.target.value)} className="flex-1 border p-2.5 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-gray-50" placeholder="បញ្ចូលឈ្មោះមុខវិជ្ជាថ្មី..." required />
                        <button type="submit" className="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-bold shadow-md hover:bg-blue-700 transition-colors flex gap-2 items-center">
                            បន្ថែមមុខវិជ្ជា
                        </button>
                    </form>
                    <div className="overflow-y-auto flex-1 custom-scrollbar pr-2">
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pb-4">
                            {allSubjects.map(sub => (
                                <div key={sub} className="flex items-center justify-between p-3 border rounded-xl bg-white shadow-sm hover:border-blue-300 transition-all group">
                                    {editingSub === sub ? (
                                        <input type="text" value={editValue} onChange={e => setEditValue(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleSaveEdit(sub)} onBlur={() => handleSaveEdit(sub)} autoFocus className="border-2 border-blue-400 p-1.5 rounded w-full text-sm font-bold outline-none" />
                                    ) : (
                                        <span className="font-bold text-gray-700">{sub}</span>
                                    )}
                                    {editingSub !== sub && (
                                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-2 shrink-0">
                                            <button onClick={() => { setEditingSub(sub); setEditValue(sub); }} className="p-1.5 text-blue-500 hover:bg-blue-50 hover:text-blue-700 rounded-full">✏️</button>
                                            <button onClick={() => removeSubject(sub)} className="p-1.5 text-red-400 hover:bg-red-50 hover:text-red-600 rounded-full">🗑️</button>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ================= Teacher Components =================
        function TeacherManager({ classes, teachers, addTeacher, updateTeacher, removeTeacher, allSubjects, addCustomSubject }) {
            const [editingId, setEditingId] = useState(null);
            const [name, setName] = useState('');
            const [teacherLevel, setTeacherLevel] = useState('ទុតិយភូមិ');
            const [teacherRole, setTeacherRole] = useState('គ្រូបង្រៀន');
            const [assignments, setAssignments] = useState([]); 
            const [newSubject, setNewSubject] = useState('');
            const [specificSlotsOff, setSpecificSlotsOff] = useState({});
            const [maxHours, setMaxHours] = useState(0); 
            
            const [tickedHours, setTickedHours] = useState(0);
            const [assignedSubjectHours, setAssignedSubjectHours] = useState(0);

            const stateBaseHours = teacherLevel === 'បឋមភូមិ' ? 18 : 16;
            let roleDeduction = 0;
            if (teacherRole === 'គ្រូបន្ទុកថ្នាក់') roleDeduction = 4;
            else if (teacherRole === 'ប្រធានក្រុមបច្ចេកទេស') roleDeduction = 2;
            const requiredStateHours = stateBaseHours - roleDeduction;

            useEffect(() => {
                let totalAvailableSlots = 0;
                WEEK_DAYS.forEach(day => {
                    const morningDay = `${day} - ព្រឹក`;
                    const afternoonDay = `${day} - ល្ងាច`;
                    MORNING_SLOTS.forEach(slot => {
                        const isOff = specificSlotsOff[morningDay] && specificSlotsOff[morningDay].includes(slot.id);
                        if (!isOff) totalAvailableSlots++;
                    });
                    AFTERNOON_SLOTS.forEach(slot => {
                        const isOff = specificSlotsOff[afternoonDay] && specificSlotsOff[afternoonDay].includes(slot.id);
                        if (!isOff) totalAvailableSlots++;
                    });
                });
                setTickedHours(totalAvailableSlots);
                setMaxHours(totalAvailableSlots);
            }, [specificSlotsOff]);

            useEffect(() => {
                let totalAssigned = 0;
                assignments.forEach(a => {
                    if (a.subject) {
                        if (a.allowedClasses.length > 0) {
                            a.allowedClasses.forEach(cId => {
                                const c = classes.find(cls => cls.id === cId);
                                if (c && c.subjectHours && c.subjectHours[a.subject]) {
                                    totalAssigned += c.subjectHours[a.subject];
                                }
                            });
                        } else {
                            classes.forEach(c => {
                                if (c.subjectHours && c.subjectHours[a.subject]) {
                                    totalAssigned += c.subjectHours[a.subject];
                                }
                            });
                        }
                    }
                });
                setAssignedSubjectHours(totalAssigned);
            }, [assignments, classes]);

            const handleSubmit = (e) => {
                e.preventDefault();
                const validAssignments = assignments.filter(a => a.subject !== '');
                if (!name || validAssignments.length === 0) {
                    alert('សូមបញ្ចូលឈ្មោះគ្រូ និងជ្រើសរើសមុខវិជ្ជាយ៉ាងហោចណាស់មួយ!');
                    return;
                }
                
                const subjects = validAssignments.map(a => a.subject);
                const subjectClasses = {};
                validAssignments.forEach(a => { subjectClasses[a.subject] = a.allowedClasses; });

                const teacherData = { 
                    name, teacherLevel, teacherRole, requiredStateHours,
                    subjects, subjectClasses, specificSlotsOff, maxHours, assignments: validAssignments 
                };

                if (editingId) {
                    updateTeacher(editingId, teacherData);
                    setEditingId(null);
                } else {
                    addTeacher(teacherData);
                }
                
                setName(''); setTeacherLevel('ទុតិយភូមិ'); setTeacherRole('គ្រូបង្រៀន'); setAssignments([]); setSpecificSlotsOff({}); setMaxHours(0);
            };

            const handleEdit = (teacher) => {
                setName(teacher.name);
                setTeacherLevel(teacher.teacherLevel || 'ទុតិយភូមិ');
                setTeacherRole(teacher.teacherRole || 'គ្រូបង្រៀន');
                
                if (teacher.assignments) {
                    setAssignments(teacher.assignments);
                } else if (teacher.subjects) {
                    const mappedAssignments = teacher.subjects.map(sub => ({
                        subject: sub, allowedClasses: teacher.subjectClasses?.[sub] || teacher.allowedClasses || []
                    }));
                    setAssignments(mappedAssignments);
                } else {
                    setAssignments([]);
                }
                
                setSpecificSlotsOff(teacher.specificSlotsOff || {});
                setMaxHours(teacher.maxHours || 0);
                setEditingId(teacher.id);
            };

            const cancelEdit = () => {
                setEditingId(null); setName(''); setTeacherLevel('ទុតិយភូមិ'); setTeacherRole('គ្រូបង្រៀន'); setAssignments([]); setSpecificSlotsOff({}); setMaxHours(0);
            };

            const handleAddCustomSubject = () => {
                if (newSubject.trim()) { addCustomSubject(newSubject.trim()); setNewSubject(''); }
            };

            const addAssignment = () => setAssignments([...assignments, { subject: '', allowedClasses: [] }]);
            const removeAssignment = (index) => { const newAssignments = [...assignments]; newAssignments.splice(index, 1); setAssignments(newAssignments); };
            const updateAssignmentSubject = (index, newSubject) => { const newAssignments = [...assignments]; newAssignments[index].subject = newSubject; setAssignments(newAssignments); };
            const toggleAssignmentClass = (assignmentIndex, classId) => {
                const newAssignments = [...assignments];
                const currentClasses = newAssignments[assignmentIndex].allowedClasses;
                if (currentClasses.includes(classId)) {
                    newAssignments[assignmentIndex].allowedClasses = currentClasses.filter(id => id !== classId);
                } else {
                    newAssignments[assignmentIndex].allowedClasses = [...currentClasses, classId];
                }
                setAssignments(newAssignments);
            };

            const toggleSpecificSlot = (day, slotId) => {
                const newOff = { ...specificSlotsOff };
                if (!newOff[day]) newOff[day] = [];
                if (newOff[day].includes(slotId)) {
                    newOff[day] = newOff[day].filter(id => id !== slotId);
                } else {
                    newOff[day].push(slotId);
                }
                setSpecificSlotsOff(newOff);
            };

            return (
                <div className="flex flex-col lg:flex-row gap-6 h-full">
                    {/* Form Section */}
                    <div className="w-full lg:w-[70%] bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col shrink-0 overflow-y-auto custom-scrollbar print-hidden-section" style={{maxHeight: 'calc(100vh - 120px)'}}>
                        <h2 className="text-lg font-bold mb-4 text-blue-800 flex items-center gap-2 border-b pb-2 sticky top-0 bg-white z-10">
                            {editingId ? 'កែប្រែទិន្នន័យគ្រូបង្រៀន' : 'បន្ថែមគ្រូបង្រៀនថ្មី'}
                        </h2>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">ឈ្មោះគ្រូបង្រៀន</label>
                                    <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full border-2 border-gray-200 p-2.5 rounded-lg focus:ring-0 focus:border-blue-500 font-bold bg-gray-50" placeholder="ឧ. លោកគ្រូ ក" required />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">កម្រិតគ្រូបង្រៀន</label>
                                    <select value={teacherLevel} onChange={e => setTeacherLevel(e.target.value)} className="w-full border-2 border-gray-200 p-2.5 rounded-lg focus:ring-0 focus:border-blue-500 font-bold bg-gray-50">
                                        <option value="ទុតិយភូមិ">ទុតិយភូមិ (១៦ ម៉ោង/សប្តាហ៍)</option>
                                        <option value="បឋមភូមិ">បឋមភូមិ (១៨ ម៉ោង/សប្តាហ៍)</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">តួនាទី (កាត់បន្ថយម៉ោងបង្រៀន)</label>
                                    <select value={teacherRole} onChange={e => setTeacherRole(e.target.value)} className="w-full border-2 border-gray-200 p-2.5 rounded-lg focus:ring-0 focus:border-blue-500 font-bold bg-gray-50">
                                        <option value="គ្រូបង្រៀន">គ្រូបង្រៀនធម្មតា (មិនកាត់ម៉ោង)</option>
                                        <option value="គ្រូបន្ទុកថ្នាក់">គ្រូបន្ទុកថ្នាក់ (កាត់ ៤ ម៉ោង)</option>
                                        <option value="ប្រធានក្រុមបច្ចេកទេស">ប្រធានក្រុមបច្ចេកទេស (កាត់ ២ ម៉ោង)</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">ស្ថិតិម៉ោងបង្រៀនប្រចាំសប្តាហ៍</label>
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                                    <div className="bg-blue-50 p-3 rounded-lg border border-blue-200 text-center shadow-sm">
                                        <div className="text-[11px] text-blue-600 font-bold mb-1">ម៉ោងរដ្ឋតម្រូវអប្បបរមា</div>
                                        <div className="text-xl font-bold text-blue-900 leading-none">{requiredStateHours} <span className="text-[10px]">ម៉ោង</span></div>
                                        <div className="text-[9px] text-blue-500 mt-1">({teacherLevel} - {roleDeduction} ម៉ោងតួនាទី)</div>
                                    </div>
                                    <div className="bg-purple-50 p-3 rounded-lg border border-purple-200 text-center shadow-sm">
                                        <div className="text-[11px] text-purple-600 font-bold mb-1">ម៉ោងទំនេរ (Tick បៃតង)</div>
                                        <div className="text-xl font-bold text-purple-900 leading-none">{tickedHours} <span className="text-[10px]">ម៉ោង</span></div>
                                    </div>
                                    <div className="bg-green-50 p-3 rounded-lg border border-green-200 text-center shadow-sm">
                                        <div className="text-[11px] text-green-600 font-bold mb-1">ម៉ោងបានចាត់តាំងពីថ្នាក់</div>
                                        <div className="text-xl font-bold text-green-900 leading-none">{assignedSubjectHours} <span className="text-[10px]">ម៉ោង</span></div>
                                    </div>
                                    <div className="bg-orange-50 p-3 rounded-lg border border-orange-200 text-center shadow-sm">
                                        <div className="text-[11px] text-orange-600 font-bold mb-1">ម៉ោងលើសពីរដ្ឋតម្រូវ</div>
                                        <div className="text-xl font-bold text-orange-900 leading-none">{Math.max(0, assignedSubjectHours - requiredStateHours)} <span className="text-[10px]">ម៉ោង</span></div>
                                    </div>
                                    <div className="bg-red-50 p-3 rounded-lg border border-red-200 text-center shadow-sm">
                                        <div className="text-[11px] text-red-600 font-bold mb-1">ម៉ោងសរុប (Tick + លើស)</div>
                                        <div className="text-xl font-bold text-red-900 leading-none">{tickedHours + Math.max(0, assignedSubjectHours - requiredStateHours)} <span className="text-[10px]">ម៉ោង</span></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                                <div className="flex justify-between items-center mb-4">
                                    <label className="block text-sm font-bold text-gray-700">មុខវិជ្ជា និង ថ្នាក់ដែលគាត់បង្រៀន</label>
                                    <button type="button" onClick={addAssignment} className="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-200 transition-colors flex items-center gap-1 border border-indigo-200 shadow-sm">
                                        បន្ថែមមុខវិជ្ជា
                                    </button>
                                </div>

                                {assignments.length === 0 ? (
                                    <div className="text-center p-4 bg-white rounded-lg border border-dashed border-gray-300 text-gray-500 text-sm">សូមចុចប៊ូតុង "បន្ថែមមុខវិជ្ជា" ខាងលើ</div>
                                ) : (
                                    <div className="space-y-4">
                                        {assignments.map((assignment, idx) => (
                                            <div key={idx} className="bg-white p-3 rounded-lg border shadow-sm relative">
                                                <button type="button" onClick={() => removeAssignment(idx)} className="absolute -top-2 -right-2 bg-red-100 text-red-600 rounded-full p-1 border border-red-200 hover:bg-red-200 transition-colors shadow-sm" title="លុបមុខវិជ្ជានេះ">
                                                    🗑️
                                                </button>
                                                
                                                <div className="mb-3">
                                                    <span className="inline-block bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded-full font-bold mb-1 border border-blue-200">មុខវិជ្ជាទី {idx + 1}</span>
                                                    <select 
                                                        value={assignment.subject} 
                                                        onChange={e => updateAssignmentSubject(idx, e.target.value)} 
                                                        className="w-full border-2 border-gray-200 p-2 rounded-lg focus:ring-0 focus:border-blue-500 font-bold text-sm bg-gray-50"
                                                        required
                                                    >
                                                        <option value="" disabled>-- ជ្រើសរើសមុខវិជ្ជា --</option>
                                                        {allSubjects.map(s => <option key={s} value={s}>{s}</option>)}
                                                    </select>
                                                </div>

                                                <div className="border-t pt-2 mt-2">
                                                    <label className="block text-xs font-bold text-gray-600 mb-2">បង្រៀននៅថ្នាក់៖ <span className="text-[10px] font-normal italic text-gray-400">(បើមិនរើស = បង្រៀនគ្រប់ថ្នាក់)</span></label>
                                                    {classes.length === 0 ? (
                                                        <div className="text-xs text-red-500 italic bg-red-50 p-2 rounded">សូមបង្កើតថ្នាក់រៀនជាមុនសិន។</div>
                                                    ) : (
                                                        <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto custom-scrollbar">
                                                            {classes.map(c => (
                                                                <button 
                                                                    key={c.id} 
                                                                    type="button" 
                                                                    onClick={() => toggleAssignmentClass(idx, c.id)} 
                                                                    className={`px-2 py-1 text-[11px] rounded border transition-colors ${assignment.allowedClasses.includes(c.id) ? 'bg-indigo-100 border-indigo-300 text-indigo-800 font-bold shadow-inner' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-100 shadow-sm'}`}
                                                                >
                                                                    ថ្នាក់ {c.name}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <div className="mt-4 pt-3 border-t border-dashed flex gap-2">
                                    <input type="text" value={newSubject} onChange={e => setNewSubject(e.target.value)} onKeyPress={e => e.key === 'Enter' && (e.preventDefault(), handleAddCustomSubject())} className="flex-1 border p-1.5 rounded-lg text-sm" placeholder="វាយបញ្ចូលមុខវិជ្ជាថ្មី បើរកមិនឃើញ..." />
                                    <button type="button" onClick={handleAddCustomSubject} className="bg-gray-200 px-3 rounded-lg text-sm font-bold hover:bg-gray-300 transition-colors shadow-sm">បន្ថែមចូលបញ្ជី</button>
                                </div>
                            </div>
                            
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">ម៉ោងសុំសម្រាកតាមថ្ងៃ (ចុចលើម៉ោងដើម្បីបិទ)</label>
                                <div className="overflow-x-auto border rounded-lg shadow-sm">
                                    <table className="w-full text-xs text-center border-collapse bg-white">
                                        <thead>
                                            <tr className="bg-gray-100 border-b">
                                                <th className="p-2 border-r font-bold w-20">ម៉ោង</th>
                                                {WEEK_DAYS.map(d => <th key={d} className="p-2 border-r font-bold">{d}</th>)}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td colSpan={7} className="border-b p-1.5 font-bold bg-gray-50 text-left pl-3 text-gray-600">ពេលព្រឹក</td>
                                            </tr>
                                            {MORNING_SLOTS.map(slot => (
                                                <tr key={slot.id} className="border-b">
                                                    <td className="p-1.5 border-r font-bold bg-gray-50 whitespace-nowrap text-[10px]">{slot.time}</td>
                                                    {WEEK_DAYS.map(dayName => {
                                                        const specificDay = `${dayName} - ព្រឹក`;
                                                        const isOff = specificSlotsOff[specificDay] && specificSlotsOff[specificDay].includes(slot.id);
                                                        return (
                                                            <td key={`${dayName}-${slot.id}`} className="p-0.5 border-r border-dashed">
                                                                <button type="button" onClick={() => toggleSpecificSlot(specificDay, slot.id)} className={`w-full py-2 rounded transition-colors font-bold ${isOff ? 'bg-red-500 text-white shadow-inner' : 'bg-green-100 text-green-700 hover:bg-green-200'}`} title={isOff ? 'សម្រាក' : 'បង្រៀន'}>
                                                                    {isOff ? 'X' : '✓'}
                                                                </button>
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                            <tr>
                                                <td colSpan={7} className="border-b p-1.5 font-bold bg-gray-50 text-left pl-3 text-gray-600">ពេលរសៀល</td>
                                            </tr>
                                            {AFTERNOON_SLOTS.map(slot => (
                                                <tr key={slot.id} className="border-b">
                                                    <td className="p-1.5 border-r font-bold bg-gray-50 whitespace-nowrap text-[10px]">{slot.time}</td>
                                                    {WEEK_DAYS.map(dayName => {
                                                        const specificDay = `${dayName} - ល្ងាច`;
                                                        const isOff = specificSlotsOff[specificDay] && specificSlotsOff[specificDay].includes(slot.id);
                                                        return (
                                                            <td key={`${dayName}-${slot.id}`} className="p-0.5 border-r border-dashed">
                                                                <button type="button" onClick={() => toggleSpecificSlot(specificDay, slot.id)} className={`w-full py-2 rounded transition-colors font-bold ${isOff ? 'bg-red-500 text-white shadow-inner' : 'bg-green-100 text-green-700 hover:bg-green-200'}`} title={isOff ? 'សម្រាក' : 'បង្រៀន'}>
                                                                    {isOff ? 'X' : '✓'}
                                                                </button>
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div className="pt-2 sticky bottom-0 bg-white border-t mt-4 flex gap-3 pb-2">
                                {editingId && (
                                    <button type="button" onClick={cancelEdit} className="w-1/3 bg-gray-200 text-gray-700 font-bold py-3 rounded-lg shadow-sm hover:bg-gray-300 transition-colors">
                                        បោះបង់
                                    </button>
                                )}
                                <button type="submit" className={`${editingId ? 'w-2/3 bg-green-600 hover:bg-green-700' : 'w-full bg-blue-600 hover:bg-blue-700'} text-white font-bold py-3 rounded-lg shadow-md transition-colors flex items-center justify-center gap-2`}>
                                    {editingId ? 'រក្សាទុកការកែប្រែ' : 'រក្សាទុកទិន្នន័យគ្រូ'}
                                </button>
                            </div>
                        </form>
                    </div>
                    
                    {/* List Section */}
                    <div className="w-full lg:w-[30%] bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col overflow-hidden print-hide-border print:w-full print:max-h-none print:overflow-visible" style={{maxHeight: 'calc(100vh - 120px)'}}>
                        <div className="flex flex-wrap justify-between items-center mb-4 border-b pb-2 shrink-0 gap-2 print:hidden">
                            <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                បញ្ជីឈ្មោះគ្រូ ({teachers.length})
                            </h2>
                            <button type="button" onClick={() => window.print()} className="bg-gray-800 text-white hover:bg-gray-900 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-1 shadow-sm" title="បោះពុម្ពបញ្ជីឈ្មោះគ្រូ">
                                បោះពុម្ព
                            </button>
                        </div>
                        <div className="overflow-auto flex-1 custom-scrollbar pr-2 print:overflow-visible">
                            <div className="space-y-3 print:hidden">
                                {teachers.length === 0 ? (
                                    <div className="p-8 text-center text-gray-500 bg-gray-50 rounded-lg border border-dashed">មិនទាន់មានទិន្នន័យគ្រូបង្រៀន</div>
                                ) : (
                                    teachers.map(t => (
                                        <div key={t.id} className={`bg-white border rounded-xl p-3 shadow-sm relative group hover:border-blue-300 transition-colors ${editingId === t.id ? 'border-blue-500 ring-2 ring-blue-200' : 'border-gray-200'}`}>
                                            <div className="absolute top-2 right-2 flex gap-1">
                                                <button onClick={() => handleEdit(t)} className="text-gray-400 hover:text-blue-500 hover:bg-blue-50 p-1.5 rounded-full transition-all" title="កែប្រែ">✏️</button>
                                                <button onClick={() => removeTeacher(t.id)} className="text-gray-400 hover:text-red-500 hover:bg-red-50 p-1.5 rounded-full transition-all" title="លុប">🗑️</button>
                                            </div>
                                            <div className="flex items-start gap-3 mb-2 pr-12">
                                                <div className="bg-blue-100 text-blue-700 w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shrink-0 border border-blue-200">
                                                    {t.name.charAt(0)}
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-gray-800 leading-tight">{t.name}</h3>
                                                    <div className="text-xs text-gray-500 mt-1 flex gap-2">
                                                        <span className="bg-gray-100 px-1.5 py-0.5 rounded text-gray-600 font-bold">{t.teacherLevel}</span>
                                                        <span className="bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-bold">រដ្ឋ៖ {t.requiredStateHours || 0} ម៉ោង</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="mt-2 space-y-1.5 border-t pt-2 border-dashed">
                                                <div className="text-[11px]">
                                                    <span className="text-gray-500 block mb-2 font-bold">មុខវិជ្ជា និង ថ្នាក់បង្រៀន៖</span>
                                                    <div className="space-y-2">
                                                        {t.assignments && t.assignments.map((assignment, idx) => (
                                                            <div key={idx} className="flex flex-col gap-0.5 bg-gray-50 p-2 rounded-lg border border-gray-100 shadow-sm">
                                                                <span className="text-blue-700 font-bold text-[12px]">• {assignment.subject}</span>
                                                                <span className="text-gray-600 text-[10px] leading-relaxed">
                                                                    ថ្នាក់: <span className="font-bold">{assignment.allowedClasses.length > 0 ? assignment.allowedClasses.map(cId => classes.find(c => c.id === cId)?.name || cId).join(', ') : 'បង្រៀនគ្រប់ថ្នាក់'}</span>
                                                                </span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            {/* Printable Summary Table */}
                            <div className="hidden print:block w-full">
                                <div className="text-center mb-6">
                                    <h1 className="text-2xl font-bold mb-2 font-khmer-muol">បញ្ជីឈ្មោះគ្រូបង្រៀន និង ការបែងចែកម៉ោង</h1>
                                    <h2 className="text-lg font-bold text-gray-700">សរុបមានចំនួន {teachers.length} នាក់</h2>
                                </div>
                                <table className="w-full text-sm text-center border-collapse border border-gray-800 print-border-black">
                                    <thead>
                                        <tr className="bg-gray-200">
                                            <th className="border border-gray-800 p-2 w-12">ល.រ</th>
                                            <th className="border border-gray-800 p-2 w-48">គោត្តនាម និង នាម</th>
                                            <th className="border border-gray-800 p-2 w-24">ម៉ោងរដ្ឋតម្រូវ</th>
                                            <th className="border border-gray-800 p-2 text-left">មុខវិជ្ជា និង ថ្នាក់ដែលត្រូវបង្រៀន</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {teachers.map((t, i) => (
                                            <tr key={t.id}>
                                                <td className="border border-gray-800 p-2">{i + 1}</td>
                                                <td className="border border-gray-800 p-2 font-bold text-left">{t.name}</td>
                                                <td className="border border-gray-800 p-2 font-bold text-blue-800">{t.requiredStateHours || 0}</td>
                                                <td className="border border-gray-800 p-2 text-left text-xs leading-relaxed">
                                                    {t.assignments && t.assignments.map((assignment, idx) => {
                                                        const classNames = assignment.allowedClasses.length > 0 
                                                            ? assignment.allowedClasses.map(cId => classes.find(c => c.id === cId)?.name || cId).join(', ') 
                                                            : 'គ្រប់ថ្នាក់';
                                                        return (
                                                            <div key={idx} className="mb-1">
                                                                <span className="font-bold">{assignment.subject}:</span> ថ្នាក់ {classNames}
                                                            </div>
                                                        );
                                                    })}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ================= Class Components =================
        function ClassManager({ classes, addClass, updateClass, removeClass, allSubjects, handleImportData }) {
            const [editingId, setEditingId] = useState(null);
            const [grade, setGrade] = useState('១២');
            const [section, setSection] = useState('A');
            const [type, setType] = useState('ទូទៅ');
            const [studentsCount, setStudentsCount] = useState(40);
            
            const [subjectRules, setSubjectRules] = useState({});
            const [ruleModal, setRuleModal] = useState(null); 
            
            const [subjectHours, setSubjectHours] = useState(() => {
                const initial = {};
                allSubjects.forEach(s => initial[s] = 0);
                return initial;
            });

            useEffect(() => {
                setSubjectHours(prev => {
                    const next = { ...prev };
                    allSubjects.forEach(s => { if (next[s] === undefined) next[s] = 0; });
                    return next;
                });
            }, [allSubjects]);

            const handleSubmit = (e) => {
                e.preventDefault();
                const name = `${grade}${section}`;
                let level = parseInt(grade) <= 9 ? 'បឋមភូមិ' : 'ទុតិយភូមិ';
                if (type !== 'ទូទៅ') level += ` (${type})`;
                
                const cleanSubjectHours = {};
                Object.entries(subjectHours).forEach(([sub, h]) => {
                    cleanSubjectHours[sub] = parseInt(h) || 0;
                });

                if (editingId) {
                    updateClass(editingId, { name, grade, section, type, level, studentsCount, subjectHours: cleanSubjectHours, subjectRules });
                    setEditingId(null);
                } else {
                    addClass({ name, grade, section, type, level, studentsCount, subjectHours: cleanSubjectHours, subjectRules });
                }
                
                setStudentsCount(40);
                const initial = {};
                allSubjects.forEach(s => initial[s] = 0);
                setSubjectHours(initial);
                setSubjectRules({});
            };

            const handleEdit = (cls) => {
                setGrade(cls.grade || (cls.name ? cls.name.match(/([០-៩]+|\d+)/)?.[0] : '១២') || '១២');
                setSection(cls.section || (cls.name ? cls.name.match(/[A-Za-z]+/)?.[0] : 'A') || 'A');
                setType(cls.type || 'ទូទៅ');
                setStudentsCount(cls.studentsCount || 40);
                setSubjectRules(cls.subjectRules || {});
                
                const initialHours = {};
                allSubjects.forEach(s => initialHours[s] = cls.subjectHours?.[s] || 0);
                setSubjectHours(initialHours);
                setEditingId(cls.id);
            };

            const cancelEdit = () => {
                setEditingId(null); setStudentsCount(40);
                const initial = {}; allSubjects.forEach(s => initial[s] = 0);
                setSubjectHours(initial); setSubjectRules({});
            };

            const handleHoursChange = (sub, val) => {
                setSubjectHours({ ...subjectHours, [sub]: val === '' ? '' : parseInt(val) || 0 });
            };

            const handleRuleChange = (sub, field, value) => {
                setSubjectRules(prev => ({
                    ...prev,
                    [sub]: { 
                        ...(prev[sub] || { consecutive: 1, singleSession: false }), 
                        [field]: value 
                    }
                }));
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = window.XLSX.read(data, {type: 'array'});
                        
                        let newSubjects = new Set(allSubjects);
                        let classList = [];
                        let curriculumMap = {};

                        workbook.SheetNames.forEach(sheetName => {
                            const rawData = window.XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "" });
                            if (rawData.length < 2) return;

                            const gradeHeaderRowIdx = rawData.findIndex(row => row.some(cell => String(cell).includes('អក្សរថ្នាក់')));
                            if (gradeHeaderRowIdx !== -1) {
                                const headers = rawData[gradeHeaderRowIdx];
                                const gradeIdx = headers.findIndex(h => String(h).includes('ថ្នាក់') && !String(h).includes('អក្សរ') && !String(h).includes('ប្រភេទ'));
                                const sectionIdx = headers.findIndex(h => String(h).includes('អក្សរថ្នាក់'));
                                const typeIdx = headers.findIndex(h => String(h).includes('ប្រភេទថ្នាក់'));
                                const levelIdx = headers.findIndex(h => String(h).includes('កម្រិត'));
                                
                                for (let i = gradeHeaderRowIdx + 1; i < rawData.length; i++) {
                                    const row = rawData[i];
                                    if (!row[gradeIdx] && !row[sectionIdx]) continue;
                                    
                                    let gradeStr = String(row[gradeIdx] || '').trim();
                                    let sectionStr = String(row[sectionIdx] || '').trim();
                                    let typeStr = String(typeIdx !== -1 ? row[typeIdx] : '').trim();
                                    let levelStr = String(levelIdx !== -1 ? row[levelIdx] : '').trim();
                                    let parsedGrade = gradeStr.replace(/[០-៩]/g, m => '០១២៣៤៥៦៧៨៩'.indexOf(m));

                                    if (gradeStr || sectionStr) {
                                        classList.push({
                                            grade: parsedGrade, section: sectionStr, type: typeStr || 'ទូទៅ', level: levelStr, name: `${parsedGrade}${sectionStr}`
                                        });
                                    }
                                }
                            }

                            const subjHeaderRowIdx = rawData.findIndex(row => row.some(cell => String(cell).includes('មុខវិជ្ជា')));
                            if (subjHeaderRowIdx !== -1) {
                                const colMap = {};
                                const subHeaderRow = rawData[subjHeaderRowIdx];

                                for (let col = 0; col < subHeaderRow.length; col++) {
                                    let subHeader = String(subHeaderRow[col] || '').trim();
                                    let key = '';
                                    if (subHeader.includes('៧') || subHeader.includes('7')) key = '7';
                                    else if (subHeader.includes('៨') || subHeader.includes('8')) key = '8';
                                    else if (subHeader.includes('៩') || subHeader.includes('9')) key = '9';
                                    else if (subHeader.includes('១០') || subHeader.includes('10')) key = subHeader.includes('សង្គម') ? '10_សង្គម' : '10_វិទ្យាសាស្ត្រ';
                                    else if (subHeader.includes('១១') || subHeader.includes('11')) key = subHeader.includes('សង្គម') ? '11_សង្គម' : '11_វិទ្យាសាស្ត្រ';
                                    else if (subHeader.includes('១២') || subHeader.includes('12')) key = subHeader.includes('សង្គម') ? '12_សង្គម' : '12_វិទ្យាសាស្ត្រ';
                                    if (key) colMap[col] = key;
                                }

                                const subjColIdx = subHeaderRow.findIndex(cell => String(cell).includes('មុខវិជ្ជា'));
                                
                                for (let i = subjHeaderRowIdx + 1; i < rawData.length; i++) {
                                    const row = rawData[i];
                                    let subject = String(row[subjColIdx] || '').trim();
                                    if (!subject || subject.includes('សរុប') || subject.match(/total/i)) continue;
                                    
                                    subject = subject.replace(/[\n\r]+/g, ' ').replace(/\s{2,}/g, ' ');
                                    newSubjects.add(subject);

                                    Object.keys(colMap).forEach(colIdx => {
                                        let hours = parseInt(row[colIdx]) || 0;
                                        let mapKey = colMap[colIdx];
                                        if (!curriculumMap[mapKey]) curriculumMap[mapKey] = {};
                                        if (hours > 0) curriculumMap[mapKey][subject] = hours;
                                    });
                                }
                            }
                        });

                        const finalClasses = [];
                        classList.forEach(c => {
                            let typeKey = '';
                            if (parseInt(c.grade) >= 10) typeKey = (c.type && c.type.includes('សង្គម')) ? 'សង្គម' : 'វិទ្យាសាស្ត្រ';
                            let lookupKey = typeKey ? `${c.grade}_${typeKey}` : c.grade;
                            let subjectHours = curriculumMap[lookupKey] || {};
                            let finalLevel = c.level;
                            if (!finalLevel) finalLevel = parseInt(c.grade) <= 9 ? 'បឋមភូមិ' : 'ទុតិយភូមិ';
                            if (c.type && c.type !== 'ទូទៅ' && !finalLevel.includes(c.type)) finalLevel = `${finalLevel} (${c.type})`;

                            finalClasses.push({
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                                name: c.name, grade: c.grade, section: c.section, type: c.type || 'ទូទៅ', level: finalLevel,
                                studentsCount: 40, subjectHours: { ...subjectHours }, subjectRules: {}
                            });
                        });

                        if (finalClasses.length === 0) {
                            alert("រកមិនឃើញទិន្នន័យថ្នាក់ (Sheet ដែលមានជួរឈរ 'អក្សរថ្នាក់') ទេ!");
                            return;
                        }

                        if (confirm(`រកឃើញថ្នាក់ចំនួន ${finalClasses.length} និងមុខវិជ្ជាសរុប ${newSubjects.size}។ តើអ្នកចង់នាំចូលមែនទេ?`)) {
                            handleImportData(finalClasses, Array.from(newSubjects));
                        }
                    } catch (error) {
                        console.error(error);
                        alert('មានបញ្ហាក្នុងការអានឯកសារ Excel។');
                    }
                    e.target.value = null;
                };
                reader.readAsArrayBuffer(file);
            };

            const totalHours = Object.values(subjectHours).reduce((a, b) => a + (parseInt(b) || 0), 0);

            return (
                <div className="flex flex-col lg:flex-row gap-6 h-full print:block print:h-auto print:overflow-visible relative">
                    
                    {/* Modal លក្ខខណ្ឌមុខវិជ្ជា */}
                    {ruleModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md border border-gray-100 transform transition-all">
                                <div className="flex justify-between items-center mb-5 border-b pb-3">
                                    <h3 className="font-bold text-lg text-blue-900 font-khmer-muol flex items-center gap-2">
                                        កំណត់លក្ខខណ្ឌ៖ {ruleModal}
                                    </h3>
                                    <button onClick={() => setRuleModal(null)} className="text-gray-400 hover:text-red-500 bg-gray-50 hover:bg-red-50 rounded-full p-1.5 transition-colors">
                                        ✕
                                    </button>
                                </div>
                                
                                <div className="mb-5 bg-blue-50 p-4 rounded-xl border border-blue-100">
                                    <label className="block text-sm font-bold text-blue-900 mb-2">១. ម៉ោងត្រូវបង្រៀនជាប់គ្នា (ក្នុង១ថ្ងៃ)</label>
                                    <select 
                                        value={subjectRules[ruleModal]?.consecutive || 1}
                                        onChange={e => handleRuleChange(ruleModal, 'consecutive', parseInt(e.target.value))}
                                        className="w-full border-2 border-blue-200 p-2.5 rounded-lg font-bold focus:ring-0 focus:border-blue-500"
                                    >
                                        <option value={1}>១ ម៉ោង (ធម្មតា)</option>
                                        <option value={2}>២ ម៉ោងជាប់គ្នា (ទាញចូល២ម៉ោងជាប់គ្នា)</option>
                                        <option value={3}>៣ ម៉ោងជាប់គ្នា (ទាញចូល៣ម៉ោងជាប់គ្នា)</option>
                                        <option value={4}>៤ ម៉ោងជាប់គ្នា (ទាញចូល៤ម៉ោងជាប់គ្នា)</option>
                                    </select>
                                    <p className="text-[11px] text-blue-600 mt-2 leading-relaxed">ប្រសិនបើអ្នកកំណត់ឲ្យជាប់គ្នា ប្រព័ន្ធនឹងព្យាយាមរៀបចំម៉ោងសម្រាប់មុខវិជ្ជានេះឲ្យនៅជាប់គ្នាក្នុងថ្ងៃតែមួយ។</p>
                                </div>

                                <div className="mb-6 bg-orange-50 p-4 rounded-xl border border-orange-100">
                                    <label className="block text-sm font-bold text-orange-900 mb-2">២. ការប៉ះម៉ោងគ្នាក្នុង១ថ្ងៃ</label>
                                    <label className="flex items-start gap-3 text-sm font-bold text-gray-700 cursor-pointer p-2 bg-white rounded-lg border border-orange-200 shadow-sm hover:bg-orange-100 transition-colors">
                                        <input 
                                            type="checkbox" 
                                            checked={subjectRules[ruleModal]?.singleSession || false}
                                            onChange={e => handleRuleChange(ruleModal, 'singleSession', e.target.checked)}
                                            className="w-5 h-5 rounded text-orange-600 focus:ring-orange-500 mt-0.5"
                                        />
                                        <div>
                                            រៀនបានតែ១ពេល (ព្រឹក ឬ ល្ងាច)
                                            <p className="text-[10px] text-orange-600 mt-1 font-normal leading-relaxed">បើកំណត់បែបនេះ ប្រសិនបើមុខវិជ្ជានេះត្រូវរៀបចំចូលពេលព្រឹកហើយ វានឹងមិនអាចទាញចូលពេលល្ងាចក្នុងថ្ងៃដដែលបានទៀតទេ សម្រាប់ថ្នាក់រៀននេះ។</p>
                                        </div>
                                    </label>
                                </div>
