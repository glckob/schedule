        // ================= Schedule Viewer Components =================
        function ScheduleViewer({ classes, teachers, schedules, generateSchedule, schoolProfile, clearSchedule }) {
            const [viewType, setViewType] = useState('class'); // 'class', 'teacher', 'master'
            const [selectedClassId, setSelectedClassId] = useState(classes.length > 0 ? classes[0].id : null);
            const [selectedTeacherId, setSelectedTeacherId] = useState(teachers && teachers.length > 0 ? teachers[0].id : null);
            const [selectedMasterDay, setSelectedMasterDay] = useState(DAYS[0]);

            useEffect(() => {
                if (classes.length > 0 && !classes.find(c => c.id === selectedClassId)) {
                    setSelectedClassId(classes[0].id);
                }
            }, [classes, selectedClassId]);

            useEffect(() => {
                if (teachers && teachers.length > 0 && !teachers.find(t => t.id === selectedTeacherId)) {
                    setSelectedTeacherId(teachers[0].id);
                }
            }, [teachers, selectedTeacherId]);

            if (classes.length === 0) {
                return (
                    <div className="bg-white p-10 rounded-xl shadow-sm border border-gray-100 text-center flex flex-col items-center justify-center min-h-[60vh]">
                        <h3 className="text-xl font-bold text-gray-700 mb-2">មិនទាន់មានថ្នាក់រៀនទេ</h3>
                        <p className="text-gray-500">សូមចូលទៅកាន់ម៉ឺនុយ "ថ្នាក់រៀន" ដើម្បីបង្កើតថ្នាក់ជាមុនសិន។</p>
                    </div>
                );
            }

            const activeClass = classes.find(c => c.id === selectedClassId);
            const activeTeacher = teachers?.find(t => t.id === selectedTeacherId);
            const isScheduleEmpty = Object.keys(schedules).length === 0;

            const getTeacherCell = (tId, day, slotId) => {
                if (!schedules) return null;
                for (const classId in schedules) {
                    const cell = schedules[classId][day]?.[slotId];
                    if (cell && cell.teacherId === tId) {
                        const cls = classes.find(c => c.id === classId);
                        return { subject: cell.subject, className: cls ? cls.name : 'Unknown' };
                    }
                }
                return null;
            };

            const isMasterMorning = selectedMasterDay.includes('ព្រឹក');
            const masterSlots = SLOTS.filter(s => s.type === (isMasterMorning ? 'Morning' : 'Afternoon'));

            let teacherTotalHours = 0;
            if (viewType === 'teacher' && schedules && activeTeacher) {
                for (const classId in schedules) {
                    for (const day in schedules[classId]) {
                        for (const slotId in schedules[classId][day]) {
                            if (schedules[classId][day][slotId].teacherId === activeTeacher.id) {
                                teacherTotalHours++;
                            }
                        }
                    }
                }
            }

            let classTotalHours = 0;
            if (viewType === 'class' && schedules && activeClass) {
                const classSched = schedules[activeClass.id];
                if (classSched) {
                    for (const day in classSched) {
                        classTotalHours += Object.keys(classSched[day] || {}).length;
                    }
                }
            }

            return (
                <div className="bg-white p-5 sm:p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col overflow-hidden print-overflow-visible print:border-none print:shadow-none print:p-0" style={{maxHeight: 'calc(100vh - 120px)'}}>
                    <div className="flex flex-col xl:flex-row justify-between items-center mb-6 border-b pb-4 gap-4 no-print shrink-0">
                        <div className="flex gap-2 bg-gray-100 p-1.5 rounded-lg w-full xl:w-auto">
                            <button onClick={() => setViewType('class')} className={`flex-1 xl:flex-none px-4 py-2 rounded-md font-bold text-sm transition-colors ${viewType === 'class' ? 'bg-white text-blue-800 shadow-sm' : 'text-gray-600 hover:text-blue-600 hover:bg-gray-200'}`}>តាមថ្នាក់</button>
                            <button onClick={() => setViewType('teacher')} className={`flex-1 xl:flex-none px-4 py-2 rounded-md font-bold text-sm transition-colors ${viewType === 'teacher' ? 'bg-white text-blue-800 shadow-sm' : 'text-gray-600 hover:text-blue-600 hover:bg-gray-200'}`}>តាមគ្រូ</button>
                            <button onClick={() => setViewType('master')} className={`flex-1 xl:flex-none px-4 py-2 rounded-md font-bold text-sm transition-colors ${viewType === 'master' ? 'bg-white text-blue-800 shadow-sm' : 'text-gray-600 hover:text-blue-600 hover:bg-gray-200'}`}>តារាងរួម</button>
                        </div>

                        <div className="flex flex-wrap gap-3 w-full xl:w-auto justify-center xl:justify-end">
                            {viewType === 'class' && (
                                <select value={selectedClassId || ''} onChange={e => setSelectedClassId(e.target.value)} className="border-2 border-blue-200 p-2 rounded-lg bg-blue-50 font-bold focus:border-blue-500 focus:ring-0 text-blue-800">

                                </select>
                            )}
                            {viewType === 'teacher' && (
                                <select value={selectedTeacherId || ''} onChange={e => setSelectedTeacherId(e.target.value)} className="border-2 border-blue-200 p-2 rounded-lg bg-blue-50 font-bold focus:border-blue-500 focus:ring-0 text-blue-800">
                                    {teachers?.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                </select>

                            {viewType === 'master' && (
                                <select value={selectedMasterDay || ''} onChange={e => setSelectedMasterDay(e.target.value)} className="border-2 border-blue-200 p-2 rounded-lg bg-blue-50 font-bold focus:border-blue-500 focus:ring-0 text-blue-800">
                                    {DAYS.map(d => <option key={d} value={d}>{d}</option>)}
                                </select>
                            )}
                            
                            {!isScheduleEmpty && (
                                <button onClick={clearSchedule} className="bg-red-100 text-red-600 px-4 py-2 rounded-lg font-bold hover:bg-red-200 transition-colors border border-red-200">
                                    លុប
                                </button>
                            )}
                            <button onClick={generateSchedule} className="bg-blue-600 text-white px-5 py-2 rounded-lg font-bold shadow-md hover:bg-blue-700 transition-colors">
                                បង្កើត (Auto)

                                បោះពុម្ព
                            </button>
                        </div>
                    </div>

                    {isScheduleEmpty ? (

                            <div>
                                <p>មិនទាន់មានកាលវិភាគត្រូវបានបង្កើតទេ។<br/>សូមចុចប៊ូតុង "បង្កើត (Auto)"។</p>
                            </div>
                        </div>
                    ) : (

                            {/* Class View */}

                                                <div className="text-base mt-1">{schoolProfile.name}</div>
                                            </div>
                                            <div className="text-center">
                                                <div className="font-khmer-muol text-lg">ព្រះរាជាណាចក្រកម្ពុជា</div>
                                                <div className="font-khmer-muol">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
                                            </div>
                                        </div>
                                        <div className="text-center font-bold text-xl my-4 font-khmer-muol">កាលវិភាគប្រចាំសប្តាហ៍ ឆ្នាំសិក្សា {schoolProfile.academicYear}</div>
                                        <div className="flex justify-center gap-10 mb-2 text-base">
                                            <div>ថ្នាក់ទី៖ <b>{activeClass?.name}</b></div>
                                            <div>កម្រិត៖ <b>{activeClass?.level}</b></div>
                                        </div>
                                    </div>

                                    <table className="w-full text-sm text-center border-collapse border border-gray-800 bg-white print-border-black min-w-[800px] print:min-w-0">
                                        <thead>
                                            <tr>
                                                <th className="border border-gray-800 p-2 font-bold w-24 print:bg-transparent bg-gray-100">ម៉ោង</th>
                                                {WEEK_DAYS.map(d => <th key={d} className="border border-gray-800 p-2 font-bold w-32 print:bg-transparent bg-gray-100">{d}</th>)}

                                        </thead>
                                        <tbody>
                                            <tr>

                                            </tr>
                                            {MORNING_SLOTS.map((slot) => (
                                                <tr key={slot.id} className="hover:bg-gray-50 print:hover:bg-transparent">
                                                    <td className="border border-gray-800 p-2 font-bold">{slot.time}</td>
                                                    {WEEK_DAYS.map(day => {
                                                        const dayKey = `${day} - ព្រឹក`;
                                                        const cell = schedules[selectedClassId] && schedules[selectedClassId][dayKey] ? schedules[selectedClassId][dayKey][slot.id] : null;
                                                        return (
                                                            <td key={day} className="border border-gray-800 p-2 h-14">
                                                                {cell ? (
                                                                    <div className="flex flex-col items-center justify-center">
                                                                        <span className="font-bold text-gray-800">{cell.subject}</span>
                                                                        <span className="text-blue-700 print:text-black text-xs mt-1">
                                                                            {cell.teacherName}
                                                                            {cell.isOvertime && <span className="text-red-500 print:text-black font-bold ml-0.5">*</span>}
                                                                        </span>
                                                                    </div>
                                                                ) : ''}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                            <tr>
                                                <td colSpan={7} className="border border-gray-800 p-1.5 font-bold print:bg-transparent bg-gray-50 font-khmer-muol">ពេលរសៀល</td>
                                            </tr>
                                            {AFTERNOON_SLOTS.map((slot) => (
                                                <tr key={slot.id} className="hover:bg-gray-50 print:hover:bg-transparent">
                                                    <td className="border border-gray-800 p-2 font-bold">{slot.time}</td>
                                                    {WEEK_DAYS.map(day => {
                                                        const dayKey = `${day} - ល្ងាច`;
                                                        const cell = schedules[selectedClassId] && schedules[selectedClassId][dayKey] ? schedules[selectedClassId][dayKey][slot.id] : null;
                                                        return (
                                                            <td key={day} className="border border-gray-800 p-2 h-14">
                                                                {cell ? (
                                                                    <div className="flex flex-col items-center justify-center">
                                                                        <span className="font-bold text-gray-800">{cell.subject}</span>
                                                                        <span className="text-blue-700 print:text-black text-xs mt-1">
                                                                            {cell.teacherName}
                                                                            {cell.isOvertime && <span className="text-red-500 print:text-black font-bold ml-0.5">*</span>}
                                                                        </span>
                                                                    </div>
                                                                ) : ''}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    
                                    <div className="mt-8 justify-between text-sm hidden print:flex">
                                        <div className="text-center w-1/3">
                                            <div className="mb-12 font-bold">បានឃើញ និងឯកភាព<br/>នាយកសាលា</div>
                                        </div>
                                        <div className="text-left w-1/3 flex flex-col gap-2 pt-4 pl-4">
                                            <div>ចំនួនម៉ោងរៀនសរុប៖ ..... <b>{classTotalHours}</b> ..... ម៉ោង</div>
                                        </div>
                                        <div className="text-center w-1/3">
                                            <div>កូប, ថ្ងៃទី...........ខែ...........ឆ្នាំ២០២....</div>
                                            <div className="mb-12 mt-1 font-bold">ហត្ថលេខាគ្រូបន្ទុកថ្នាក់</div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Teacher View */}
                            {viewType === 'teacher' && (
                                <div className="print-schedule-container">
                                    <div className="hidden print:block mb-4 text-sm">
                                        <div className="flex justify-between items-start">
                                            <div className="text-center font-khmer-muol">
                                                <div>ក្រសួងអប់រំ យុវជន និងកីឡា</div>
                                                <div>{schoolProfile.department}</div>
                                                <div className="text-base mt-1">{schoolProfile.name}</div>
                                            </div>
                                            <div className="text-center">
                                                <div className="font-khmer-muol text-lg">ព្រះរាជាណាចក្រកម្ពុជា</div>
                                                <div className="font-khmer-muol">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
                                            </div>
                                        </div>
                                        <div className="text-center font-bold text-xl my-4 font-khmer-muol">កាលវិភាគប្រចាំសប្តាហ៍ ឆ្នាំសិក្សា {schoolProfile.academicYear}</div>
                                        
                                        <div className="flex items-center gap-8 mb-2">
                                            <div>របស់លោក/លោកស្រី៖ <b className="text-base">{activeTeacher?.name}</b></div>
                                            <div>តួនាទី-ភារកិច្ច៖ <b className="text-base">{activeTeacher?.teacherRole || 'បង្រៀន'}</b></div>
                                        </div>
                                        <div className="flex items-center gap-8 mb-3">
                                            <div>ឯកទេស៖ <b>{activeTeacher?.subjects?.join(', ')}</b></div>
                                            <div>បង្រៀនថ្នាក់៖ <b>{activeTeacher?.assignments?.length > 0 ? activeTeacher.assignments.map(a => a.allowedClasses.map(id => classes.find(c=>c.id===id)?.name).join(', ')).filter(Boolean).join(', ') : 'គ្រប់ថ្នាក់'}</b></div>
                                        </div>
                                    </div>

                                    <table className="w-full text-sm text-center border-collapse border border-gray-800 bg-white print-border-black min-w-[800px] print:min-w-0">
                                        <thead>
                                            <tr>
                                                <th className="border border-gray-800 p-2 font-bold w-24 print:bg-transparent bg-green-100">ម៉ោង</th>
                                                {WEEK_DAYS.map(d => <th key={d} className="border border-gray-800 p-2 font-bold w-32 print:bg-transparent bg-green-100">{d}</th>)}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td colSpan={7} className="border border-gray-800 p-1.5 font-bold print:bg-transparent bg-green-50 font-khmer-muol">ពេលព្រឹក</td>
                                            </tr>
                                            {MORNING_SLOTS.map((slot) => (
                                                <tr key={slot.id} className="hover:bg-gray-50 print:hover:bg-transparent">
                                                    <td className="border border-gray-800 p-2 font-bold">{slot.time}</td>
                                                    {WEEK_DAYS.map(day => {
                                                        const dayKey = `${day} - ព្រឹក`;
                                                        const cell = getTeacherCell(selectedTeacherId, dayKey, slot.id);
                                                        return (
                                                            <td key={day} className="border border-gray-800 p-2 h-14">
                                                                {cell ? (
                                                                    <div className="flex flex-col items-center justify-center">
                                                                        <span className="font-bold text-gray-800">{cell.subject}</span>
                                                                        <span className="text-green-700 print:text-black font-bold text-xs mt-1">
                                                                            ថ្នាក់ទី {cell.className}
                                                                        </span>
                                                                    </div>
                                                                ) : ''}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                            <tr>
                                                <td colSpan={7} className="border border-gray-800 p-1.5 font-bold print:bg-transparent bg-green-50 font-khmer-muol">ពេលរសៀល</td>
                                            </tr>
                                            {AFTERNOON_SLOTS.map((slot) => (
                                                <tr key={slot.id} className="hover:bg-gray-50 print:hover:bg-transparent">
                                                    <td className="border border-gray-800 p-2 font-bold">{slot.time}</td>
                                                    {WEEK_DAYS.map(day => {
                                                        const dayKey = `${day} - ល្ងាច`;
                                                        const cell = getTeacherCell(selectedTeacherId, dayKey, slot.id);
                                                        return (
                                                            <td key={day} className="border border-gray-800 p-2 h-14">
                                                                {cell ? (
                                                                    <div className="flex flex-col items-center justify-center">
                                                                        <span className="font-bold text-gray-800">{cell.subject}</span>
                                                                        <span className="text-green-700 print:text-black font-bold text-xs mt-1">
                                                                            ថ្នាក់ទី {cell.className}
                                                                        </span>
                                                                    </div>
                                                                ) : ''}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>

                                    <div className="mt-8 justify-between text-sm hidden print:flex">
                                        <div className="text-center w-1/3">
                                            <div className="mb-12 font-bold">បានឃើញ និងឯកភាព<br/>នាយកសាលា</div>
                                        </div>
                                        <div className="text-left w-1/3 flex flex-col gap-2 pt-4 pl-4">
                                            <div>ចំនួនម៉ោងបង្រៀនសរុប៖ ..... <b>{teacherTotalHours}</b> ..... ម៉ោង</div>
                                            <div>ចំនួនម៉ោងកំណត់៖ ..... <b>{activeTeacher?.requiredStateHours || 20}</b> ..... ម៉ោង</div>
                                            <div>ចំនួនម៉ោងបន្ថែម៖ ..... <b>{Math.max(0, teacherTotalHours - (activeTeacher?.requiredStateHours || 20))}</b> ..... ម៉ោង</div>
                                        </div>
                                        <div className="text-center w-1/3">
                                            <div>កូប, ថ្ងៃទី...........ខែ...........ឆ្នាំ២០២....</div>
                                            <div className="mb-12 mt-1 font-bold">ហត្ថលេខា-សាមីខ្លួន</div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Master View */}
                            {viewType === 'master' && (
                                <div className="print-schedule-container">
                                    <div className="text-center mb-4 hidden print:block">
                                        <h1 className="text-2xl font-bold mb-1 font-khmer-muol">តារាងកាលវិភាគរួម (គ្រប់ថ្នាក់)</h1>
                                        <h2 className="text-lg font-bold text-gray-600">ថ្ងៃ៖ {selectedMasterDay}</h2>
                                    </div>
                                    <table className="w-full text-sm text-center border-collapse min-w-[600px] bg-white print-border-black">
                                        <thead>
                                            <tr>
                                                <th className="border border-gray-800 p-3 bg-purple-100 text-purple-900 font-bold w-32 sticky left-0 z-10 print:bg-transparent">ថ្នាក់រៀន \ ម៉ោង</th>
                                                {masterSlots.map(s => <th key={s.id} className="border border-gray-800 p-3 font-bold bg-gray-100 text-gray-800 print:bg-transparent">{s.name.replace('ម៉ោង ','')}</th>)}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {classes.map(cls => {
                                                const scheduleForClass = schedules[cls.id] || {};
                                                const daySchedule = scheduleForClass[selectedMasterDay] || {};
                                                return (
                                                    <tr key={cls.id} className="hover:bg-gray-50 print:hover:bg-transparent">
                                                        <td className="border border-gray-800 p-3 font-bold bg-gray-50 text-gray-800 sticky left-0 z-10 print:bg-transparent">ថ្នាក់ {cls.name}</td>
                                                        {masterSlots.map(slot => {
                                                            const cell = daySchedule[slot.id];
                                                            return (
                                                                <td key={slot.id} className={`border border-gray-800 p-2 ${cell ? 'bg-indigo-50 print:bg-transparent' : ''}`}>
                                                                    {cell ? (
                                                                        <div className="flex flex-col items-center justify-center">
                                                                            <span className="font-bold text-gray-800 mb-1">{cell.subject}</span>
                                                                            <span className="text-blue-700 print:text-black text-[11px] font-bold">
                                                                                {cell.teacherName}
                                                                            </span>
                                                                        </div>
                                                                    ) : <span className="text-gray-300 print:text-white">-</span>}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                            
                            <div className="mt-4 text-xs text-gray-500 flex gap-4 no-print border-t pt-3">
                                {viewType === 'class' && <span className="flex items-center gap-1 bg-red-50 px-2 py-1 rounded border border-red-100"><span className="text-red-500 font-bold text-base leading-none">*</span> គ្រូបង្រៀនលើសម៉ោងរដ្ឋតម្រូវ (Overtime)</span>}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
